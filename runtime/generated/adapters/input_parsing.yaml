adapter_id: input_parsing_adapter
type: llm_json
provider_route:
- local
- external
route_name: input_parsing
model_complexity: low
model_capabilities:
- json_generation
- structured_reasoning
prompt: runtime/generated/prompts/input_parsing.yaml
output_schema: runtime/generated/schemas/input_parsing.schema.json
json_mode: true
stage_prompt_char_limit: 1400
max_schema_chars: 1400
provider_timeout_seconds: 120
provider_options:
  temperature: 0
  num_predict: 512
  num_ctx: 2048
  think: false
stage_boundary:
  allowed_decisions:
  - extract_explicit_fields
  - preserve_raw_input
  - normalize_modality
  forbidden_decisions:
  - business_execution
  - tool_selection
  - provider_selection
  - workflow_locking
