adapter_id: agent_action_planning_adapter
type: llm_json
provider_route:
- local
- external
route_name: agent_action_planning
model_complexity: low
model_capabilities:
- json_generation
- structured_reasoning
prompt: runtime/generated/prompts/agent_action_planning.yaml
output_schema: runtime/generated/schemas/agent_action_planning.schema.json
json_mode: true
stage_prompt_char_limit: 1400
max_schema_chars: 1400
provider_timeout_seconds: 120
provider_options:
  temperature: 0
  num_predict: 512
  num_ctx: 2048
  think: false
stage_boundary:
  allowed_decisions:
  - planner_llm_action_ranking
  - fixed_action_selection
  - substep_generation
  - execution_method_locking
  - source_policy_locking
  forbidden_decisions:
  - runtime_execution
  - final_answer_creation
  - planner_output_as_answer
  - unplanned_fallback
