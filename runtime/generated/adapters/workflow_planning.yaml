adapter_id: workflow_planning_adapter
type: llm_json
provider_route:
- local
- external
route_name: workflow_planning
model_complexity: medium
model_capabilities:
- json_generation
- structured_reasoning
prompt: runtime/generated/prompts/workflow_planning.yaml
output_schema: runtime/generated/schemas/workflow_planning.schema.json
json_mode: true
stage_prompt_char_limit: 1400
max_schema_chars: 1400
provider_timeout_seconds: 120
provider_options:
  temperature: 0
  num_predict: 512
  num_ctx: 2048
  think: false
stage_boundary:
  allowed_decisions:
  - workflow_generation
  - agent_graph_generation
  - dependency_mapping
  - agent_objective_definition
  - substep_outline
  forbidden_decisions:
  - runtime_execution
  - result_synthesis
  - final_action_execution
  - provider_selection
