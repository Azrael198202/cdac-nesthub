node_id: requirement_completion
executor_type: static_transform
prompt: runtime/generated/prompts/requirement_completion.yaml
output_schema: runtime/generated/schemas/requirement_completion.schema.json
capabilities:
- generic_runtime_stage
stage_contract:
  owner: verify required parameters against the recognized intent and either continue
    or request missing information through UI
  allowed_decisions:
  - required_parameter_check
  - pause_for_missing_information
  - merge_user_supplied_parameters
  forbidden_decisions:
  - tool_selection
  - provider_selection
  - runtime_execution
  - final_answer_creation
  output_key: requirement_record
review_required: false
progress_weight: 10
