node_id: pre_execution_validation
executor_type: static_transform
prompt: runtime/generated/prompts/pre_execution_validation.yaml
output_schema: runtime/generated/schemas/pre_execution_validation.schema.json
capabilities:
- generic_runtime_stage
stage_contract:
  owner: validate schema, parameters, tools, confirmation gates, and sandbox executability
    before execution
  allowed_decisions:
  - schema_check
  - parameter_check
  - tool_presence_check
  - generation_need_check
  - confirmation_need_check
  - sandbox_executability_check
  forbidden_decisions:
  - intent_reclassification
  - execution_policy_rewrite
  - runtime_execution
  - final_answer_creation
  output_key: validation_record
review_required: false
progress_weight: 10
