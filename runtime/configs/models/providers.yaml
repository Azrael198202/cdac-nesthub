providers:
  ollama:
    enabled: true
    type: universal_model
    protocol: ollama_chat
    base_url: http://127.0.0.1:11434
    binary: ollama
    auto_install: true
    auto_start: true
    auto_pull_missing_model: true
    start_command: '{binary} serve'
    pull_command: '{binary} pull {model}'
    pull_timeout_seconds: 3600
    install_timeout_seconds: 3600
    ready_timeout_seconds: 45
    ready_poll_interval_seconds: 1
    install:
      windows:
      - winget install Ollama.Ollama --accept-source-agreements --accept-package-agreements
        --disable-interactivity
      macos:
      - brew install ollama
      linux:
      - curl -fsSL https://ollama.com/install.sh | sh
    executable_hints:
      windows:
      - '%LOCALAPPDATA%\Programs\Ollama\ollama.exe'
      - '%ProgramFiles%\Ollama\ollama.exe'
    endpoint_strategy: auto
    chat_endpoint: /api/chat
    generate_endpoint: /api/generate
    model: qwen3:8b
    fallback_models:
    - qwen3:32b
    - qwen3:14b
    - qwen3:8b
    - qwen3:4b
    - qwen2.5:3b
    - qwen3:1.7b
    - llama3.2:8b
    - llama3.2:3b
    provider_models:
      qwen3:8b: qwen3:8b
      qwen3:14b: qwen3:14b
      qwen3:32b: qwen3:32b
    timeout_seconds: 180
    max_prompt_tokens: 10000
    response_format_json: true
    model_tags:
