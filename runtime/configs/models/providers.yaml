default_route:
- ollama
- openai
- claude
routes:
  input_parsing:
  - ollama
  - openai
  - claude
  intent_recognition:
  - ollama
  - openai
  - claude
  workflow_planning:
  - ollama
  - openai
  - claude
  reasoning:
  - ollama
  - openai
  - claude
  stable_synthesis:
  - ollama
  - openai
  - claude
  code_generation:
  - ollama_coder_qwen25
  - openai
  fallback:
  - ollama
  - openai
  - claude
providers:
  openai:
    enabled: true
    type: universal_model
    protocol: openai_compatible
    base_url: https://api.openai.com
    endpoint: /v1/chat/completions
    model: gpt-4o-mini
    auth_type: bearer_env
    auth_env: OPENAI_API_KEY
    timeout_seconds: 60
    response_format_json: true
    model_tags:
    - api
    - reasoning
    - json_generation
    capabilities:
    - reasoning
    - json_generation
  claude:
    enabled: false
    type: universal_model
    protocol: openai_compatible
    base_url: https://api.anthropic.com
    endpoint: /v1/messages
    model: claude-sonnet
    auth_type: bearer_env
    auth_env: ANTHROPIC_API_KEY
    timeout_seconds: 60
    response_format_json: true
    model_tags:
    - api
    - reasoning
    - json_generation
    capabilities:
    - reasoning
    - json_generation
  vllm:
    enabled: false
    type: universal_model
    protocol: openai_compatible
    base_url: http://127.0.0.1:8001
    endpoint: /v1/chat/completions
    model: Qwen/Qwen3-8B
    logical_model_id: qwen3:8b
    auto_start: false
    auto_install: false
    ready_timeout_seconds: 120
    ready_poll_interval_seconds: 2
    start_command: python -m vllm.entrypoints.openai.api_server --host 127.0.0.1 --port
      8001 --model Qwen/Qwen3-8B --served-model-name Qwen/Qwen3-8B
    timeout_seconds: 90
    max_prompt_tokens: 12000
    response_format_json: true
    provider_models:
      qwen3:8b: Qwen/Qwen3-8B
      qwen3:14b: Qwen/Qwen3-14B
      qwen3:32b: Qwen/Qwen3-32B
    model_tags:
    - local
    - reasoning
    - json_generation
    capabilities:
    - reasoning
    - json_generation
    disabled_reason: vllm_is_optional_enable_with_AI_CORE_ENABLE_VLLM
  ollama:
    enabled: true
    type: universal_model
    protocol: ollama_chat
    base_url: http://127.0.0.1:11434
    binary: ollama
    auto_install: true
    auto_start: true
    auto_pull_missing_model: true
    start_command: '{binary} serve'
    pull_command: '{binary} pull {model}'
    pull_timeout_seconds: 3600
    install_timeout_seconds: 3600
    ready_timeout_seconds: 60
    ready_poll_interval_seconds: 1
    install:
      windows:
      - winget install Ollama.Ollama --accept-source-agreements --accept-package-agreements
        --disable-interactivity
      macos:
      - brew install ollama
      linux:
      - curl -fsSL https://ollama.com/install.sh | sh
    executable_hints:
      windows:
      - '%LOCALAPPDATA%\Programs\Ollama\ollama.exe'
      - '%ProgramFiles%\Ollama\ollama.exe'
    endpoint_strategy: auto
    chat_endpoint: /api/chat
    generate_endpoint: /api/generate
    model: qwen3:8b
    fallback_models:
    - qwen3:8b
    - qwen3:4b
    - qwen3:1.7b
    provider_models:
      qwen3:8b: qwen3:8b
      qwen3:14b: qwen3:14b
      qwen3:32b: qwen3:32b
    timeout_seconds: 90
    max_prompt_tokens: 12000
    response_format_json: true
    model_tags:
    - local
    - reasoning
    - json_generation
    capabilities:
    - reasoning
    - json_generation
  vllm_coder:
    enabled: false
    type: universal_model
    protocol: openai_compatible
    base_url: http://127.0.0.1:8002
    endpoint: /v1/chat/completions
    model: Qwen/Qwen2.5-Coder-7B-Instruct
    auto_start: false
    timeout_seconds: 90
    response_format_json: true
    model_tags:
    - local
    - code_generation
    - json_generation
    capabilities:
    - code_generation
    - json_generation
    auto_install: false
    disabled_reason: vllm_is_optional_enable_with_AI_CORE_ENABLE_VLLM
  ollama_coder_qwen25:
    enabled: true
    type: universal_model
    protocol: ollama_chat
    base_url: http://127.0.0.1:11434
    binary: ollama
    auto_install: true
    auto_start: true
    auto_pull_missing_model: true
    model: qwen2.5-coder:7b
    fallback_models:
    - qwen2.5-coder:7b
    - qwen2.5-coder:3b
    timeout_seconds: 90
    model_tags:
    - local
    - code_generation
    - json_generation
    capabilities:
    - code_generation
    - json_generation
policy:
  require_real_provider: true
  allow_placeholder_result: false
  local_provider_order:
  - ollama
  api_provider_order:
  - openai
  - claude
