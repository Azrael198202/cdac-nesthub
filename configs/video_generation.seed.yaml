version: 1.0
scope: video_generation
capability_type: video_generation
default_route:
  - local_video_generation
  - generic_text_animation
  - external_video_generation
providers:
  generic_text_animation:
    enabled: true
    protocol: python_function
    role: local_video_generation
    capabilities:
      - video_generation
    modalities:
      input:
        - text
      output:
        - video
        - gif
    source_policy:
      mode: media_allowed
    callable: ai_core.media.providers.generic_text_animation_provider:generate_text_animation
    python_dependencies:
      - import: PIL
        package: Pillow>=10.0.0
    python_import_package_map:
      PIL: Pillow>=10.0.0
    width: 768
    height: 432
    frames: 8
    max_frames: 64
    frame_duration_ms: 120
    setup_hints:
      - This provider is a generic local text-to-animation preview fallback and does not require external model assets.
  local_video_generation:
    enabled: true
    protocol: comfyui
    role: local_video_generation
    capabilities:
      - video_generation
    modalities:
      input:
        - text
        - image
      output:
        - video
        - gif
    source_policy:
      mode: media_allowed
    timeout_seconds: 1800
    minimum_generation_timeout_seconds: 1800
    runtime:
      base_url: http://127.0.0.1:8188
      auto_start: true
      generation_timeout_seconds: 1800
      minimum_generation_timeout_seconds: 1800
      request_timeout_seconds: 60
      startup_timeout_seconds: 180
      preflight_enabled: true
      preflight_timeout_seconds: 180
      install:
        enabled: true
        repository: https://github.com/comfyanonymous/ComfyUI.git
        create_venv: true
        install_requirements: true
        clone_timeout_seconds: 600
        pip_timeout_seconds: 1800
        preflight_enabled: true
        preflight_timeout_seconds: 180
        auto_repair_torch: true
        torch_repair:
          enabled: true
          profile: cpu
          packages:
            - torch
            - torchvision
            - torchaudio
          cpu_index_url: https://download.pytorch.org/whl/cpu
          cuda_index_url: https://download.pytorch.org/whl/cu121
          cuda124_index_url: https://download.pytorch.org/whl/cu124
          timeout_seconds: 3600
    workflow_template: ${AI_CORE_VIDEO_WORKFLOW_TEMPLATE}
    workflow_bootstrap:
      enabled: true
      url_env: AI_CORE_VIDEO_WORKFLOW_TEMPLATE_URL
      repository_env: AI_CORE_VIDEO_WORKFLOW_TEMPLATE_REPOSITORY
      repository_file_env: AI_CORE_VIDEO_WORKFLOW_TEMPLATE_REPOSITORY_FILE
      file_env: AI_CORE_VIDEO_WORKFLOW_TEMPLATE_FILE
      target_dir: runtime/generated/workflow_templates/video_generation
      download_timeout_seconds: 600
      clone_timeout_seconds: 600
    workflow_values:
      prompt: "{prompt}"
      negative_prompt: "{negative_prompt}"
      frame_count: "{frame_count}"
      width: "{width}"
      height: "{height}"
      seed: "{seed}"
    model_dependency_profile: text_to_video
    model_dependency_manifest:
      enabled: true
      manifest_file: runtime/configs/media/video_model_dependency_manifest.yaml
      profile: text_to_video
    setup_hints:
      - Set AI_CORE_VIDEO_WORKFLOW_TEMPLATE to a ComfyUI video workflow JSON file, for example AnimateDiff or another runtime-installed video workflow.
      - Install the workflow's custom nodes and model assets under the configured ComfyUI runtime.
  external_video_generation:
    enabled: true
    protocol: generic_http_json
    role: external_video_generation
    capabilities:
      - video_generation
    modalities:
      input:
        - text
        - image
      output:
        - video
    source_policy:
      mode: fallback_allowed
    api_key_env: VIDEO_GENERATION_API_KEY
    video_generation_endpoint: ${VIDEO_GENERATION_ENDPOINT}
    method: POST
    timeout_seconds: 1800
    download_remote_url: true
    request_template:
      prompt: "{prompt}"
      output_format: mp4
    setup_hints:
      - Set VIDEO_GENERATION_ENDPOINT to a provider endpoint that returns a video URL, base64 video, or downloadable binary.
      - Set VIDEO_GENERATION_API_KEY when the endpoint requires authorization.
