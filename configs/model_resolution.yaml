    - qwen2.5-coder:7b
    - qwen2.5-coder:3b
    - qwen3.5:4b-q4_k_m
    - qwen3.5:4b
    - qwen3:4b
  qwen3.5:4b-q4_k_m:
    - qwen3.5:4b-q4_k_m
    - qwen3.5:4b
    - qwen3:4b
    - qwen2.5-coder:7b
