# Runtime model resolution policy.
# This file is configuration, not capability logic. It lets the model adapter
# resolve aliases, prefer code-capable local models, and pull only public models
# that are safe to obtain through the provider catalog. Imported/custom models
# should be listed as aliases/preferred models, but not as pullable unless they
# are available from the provider catalog.
