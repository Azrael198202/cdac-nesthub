<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runtime State Console</title>
  <style>
    :root{--bg:#0b1020;--panel:#11182c;--panel2:#0f172a;--line:#26334d;--text:#e5e7eb;--muted:#94a3b8;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;--purple:#a78bfa}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#0b1224;position:sticky;top:0;z-index:5}
    h1{font-size:17px;margin:0}.nav a{color:var(--muted);text-decoration:none;margin-left:12px}.nav a:hover{color:var(--text)}
    main{display:grid;grid-template-columns:330px 1fr;gap:14px;padding:14px;height:calc(100vh - 58px)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}.panel h2{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);color:#cbd5e1;background:#0d1528}
    .toolbar{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar input,.toolbar select{background:#080f1f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px}.toolbar button{background:#1e293b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}.toolbar button:hover{background:#334155}
    #runs{height:calc(100% - 91px);overflow:auto}.run{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.run:hover,.run.active{background:#172036}.run .id{font-size:12px;color:#cbd5e1;word-break:break-all}.run .meta{color:var(--muted);font-size:11px;margin-top:3px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:11px;margin-right:5px}.running{color:var(--info)}.completed{color:var(--good)}.failed{color:var(--bad)}.queued,.waiting_input,.paused{color:var(--warn)}
    .detail{display:grid;grid-template-rows:auto auto 1fr;min-height:0}.summary{padding:12px;border-bottom:1px solid var(--line);background:var(--panel2)}.summary .row{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}.bar{height:9px;background:#0b1224;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa);width:0%}
    .steps{display:flex;gap:8px;overflow:auto;padding:10px;border-bottom:1px solid var(--line);background:#0c1325}.step{min-width:220px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#0b1224}.step .name{font-weight:700;color:#e2e8f0}.step .msg{font-size:11px;color:var(--muted);height:34px;overflow:hidden}.step .bar{height:6px;margin-top:6px}
    .events{overflow:auto;padding:8px 10px}.event{display:grid;grid-template-columns:82px 92px 120px 1fr;gap:8px;border-bottom:1px dashed #223047;padding:7px 0}.event .ts{color:#64748b}.event .lvl{font-weight:700}.lvl.user{color:#7dd3fc}.lvl.developer{color:#c4b5fd}.lvl.advanced{color:#fcd34d}.lvl.diagnostic{color:#fca5a5}.kind{color:#93c5fd}.msg{white-space:pre-wrap;word-break:break-word}.json{margin-top:6px;color:#94a3b8;background:#070d1a;border:1px solid #172036;border-radius:8px;padding:7px;max-height:180px;overflow:auto;font-size:11px}
    .split{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:11px;color:var(--muted)}
    @media(max-width:900px){main{grid-template-columns:1fr;height:auto}.panel{min-height:360px}.event{grid-template-columns:1fr}.events{max-height:70vh}}
  </style>
</head>
<body>
<header>
  <h1>Runtime State Console <span class="small">/ end-to-end async state</span></h1>
  <div class="nav"><a href="/agent-studio">Agent Studio</a><a href="/runtime-console">Runtime Console</a><a href="/graph-runtime">Graph Runtime</a></div>
</header>
<main>
  <section class="panel">
    <h2>Runs</h2>
    <div class="toolbar">
      <button onclick="loadRuns()">刷新</button>
      <input id="runFilter" placeholder="过滤 run_id / title" oninput="renderRuns()" />
    </div>
    <div id="runs"></div>
  </section>
  <section class="panel detail">
    <h2>Selected Run</h2>
    <div class="summary" id="summary">请选择一个运行任务，或通过 /runtime-state?run_id=xxx 直接打开。</div>
    <div class="steps" id="steps"></div>
    <div>
      <div class="toolbar">
        <span class="small">显示等级</span>
        <select id="level" onchange="restartStream()">
          <option value="user">user</option>
          <option value="developer" selected>developer</option>
          <option value="advanced">advanced</option>
          <option value="diagnostic">diagnostic</option>
        </select>
        <button onclick="toggleAuto()" id="autoBtn">自动滚动: ON</button>
        <button onclick="clearEvents()">清空画面</button>
        <span class="small" id="streamState">stream: idle</span>
      </div>
      <div class="events" id="events"></div>
    </div>
  </section>
</main>
<script>
let runs=[], selectedRunId='', source=null, cursor=0, autoScroll=true;
const levelOrder={user:0,developer:1,advanced:2,diagnostic:3};
function cls(s){return String(s||'').replace(/[^a-zA-Z0-9_-]/g,'_')}
function statusHtml(s){return `<span class="pill ${cls(s)}">${s||'unknown'}</span>`}
function shortTime(v){if(!v)return ''; try{return new Date(v).toLocaleTimeString()}catch(e){return String(v).slice(11,19)}}
async function loadRuns(){
  const res=await fetch('/api/runtime-state/runs?limit=100',{cache:'no-store'}); const data=await res.json(); runs=data.runs||[]; renderRuns();
  if(!selectedRunId){const url=new URL(location.href); const rid=url.searchParams.get('run_id'); if(rid) selectRun(rid); else if(runs[0]) selectRun(runs[0].run_id)}
}
function renderRuns(){
  const f=(document.getElementById('runFilter').value||'').toLowerCase();
  document.getElementById('runs').innerHTML=runs.filter(r=>!f||JSON.stringify(r).toLowerCase().includes(f)).map(r=>`<div class="run ${r.run_id===selectedRunId?'active':''}" onclick="selectRun('${r.run_id}')"><div>${statusHtml(r.status)} <span class="id">${r.run_id}</span></div><div class="meta">${r.title||''}</div><div class="meta">progress=${Math.round(r.progress||0)}% · events=${r.event_count||0} · ${shortTime(r.updated_at)}</div></div>`).join('') || '<div class="run"><span class="small">暂无运行状态</span></div>';
}
async function selectRun(id){selectedRunId=id; cursor=0; renderRuns(); document.getElementById('events').innerHTML=''; await loadRun(); restartStream(); history.replaceState(null,'',`/runtime-state?run_id=${encodeURIComponent(id)}`)}
async function loadRun(){
  if(!selectedRunId)return; const res=await fetch(`/api/runtime-state/runs/${encodeURIComponent(selectedRunId)}`,{cache:'no-store'}); const data=await res.json(); if(!data.ok)return;
  const r=data.run; document.getElementById('summary').innerHTML=`<div class="row"><b>${r.title||r.run_id}</b>${statusHtml(r.status)}<span>run_id=${r.run_id}</span><span>active=${r.active_step_id||'-'}</span><span>events=${r.event_count||0}</span></div><div class="bar"><span style="width:${Math.round(r.progress||0)}%"></span></div><div class="small">${r.summary||''}</div>`;
  document.getElementById('steps').innerHTML=(r.steps||[]).map(s=>`<div class="step"><div>${statusHtml(s.status)} <span class="name">${s.name||s.step_id}</span></div><div class="small">${s.step_id}</div><div class="msg">${s.last_message||''}</div><div class="bar"><span style="width:${Math.round(s.progress||0)}%"></span></div><div class="small">method=${s.method||'-'} · tool=${s.tool||'-'}</div></div>`).join('') || '<span class="small">暂无步骤</span>';
}
function restartStream(){ if(source){source.close(); source=null} cursor=0; document.getElementById('events').innerHTML=''; startStream(); }
function startStream(){
  if(!selectedRunId)return; const min=document.getElementById('level').value;
  source=new EventSource(`/api/runtime-state/runs/${encodeURIComponent(selectedRunId)}/stream?after_sequence=${cursor}&min_level=${encodeURIComponent(min)}`);
  document.getElementById('streamState').textContent='stream: connected';
  source.onmessage=(ev)=>{try{const e=JSON.parse(ev.data); cursor=Math.max(cursor,Number(e.sequence||0)); appendEvent(e); if(cursor%5===0) loadRun();}catch(err){console.error(err)}};
  source.onerror=()=>{document.getElementById('streamState').textContent='stream: reconnecting';};
}
function appendEvent(e){
  const extra={input:e.input,output:e.output,error:e.error,trace:e.trace,evidence:e.evidence,next_action:e.next_action,metadata:e.metadata};
  const compact=Object.fromEntries(Object.entries(extra).filter(([k,v])=>v!==null&&v!==''&&!(Array.isArray(v)&&!v.length)&&!(typeof v==='object'&&v&&!Array.isArray(v)&&!Object.keys(v).length)));
  const detail=Object.keys(compact).length?`<div class="json">${escapeHtml(JSON.stringify(compact,null,2))}</div>`:'';
  const row=document.createElement('div'); row.className='event'; row.innerHTML=`<div class="ts">#${e.sequence}<br>${shortTime(e.ts)}</div><div class="lvl ${e.level}">${e.level}<br>${statusHtml(e.status)}</div><div class="kind">${e.kind}<br><span class="small">${e.step_id||''}</span></div><div class="msg"><b>${escapeHtml(e.title||'')}</b><br>${escapeHtml(e.message||'')}${detail}</div>`;
  const box=document.getElementById('events'); box.appendChild(row); if(box.children.length>1000) box.removeChild(box.firstChild); if(autoScroll) box.scrollTop=box.scrollHeight;
}
function clearEvents(){document.getElementById('events').innerHTML=''}
function toggleAuto(){autoScroll=!autoScroll; document.getElementById('autoBtn').textContent='自动滚动: '+(autoScroll?'ON':'OFF')}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
setInterval(()=>{loadRuns(); if(selectedRunId) loadRun()},3000);
loadRuns();
</script>
</body>
</html>
