<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Runtime Console</title>
  <style>
    :root{--bg:#050608;--panel:#080b10;--line:#1f2937;--text:#d7f7d7;--muted:#7f8c9a;--accent:#49d169;--cyan:#63d6ff;--warn:#ffcc66;--err:#ff6b6b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;height:100vh;display:grid;grid-template-columns:250px 1fr;overflow:hidden}
    aside{background:#090c10;border-right:1px solid var(--line);padding:14px;overflow:auto} main{display:flex;flex-direction:column;min-width:0;background:#020403}
    h1{font-size:15px;margin:0 0 12px}.nav a,.nav button{display:block;width:100%;text-align:left;margin:6px 0;text-decoration:none}.nav .sep{height:1px;background:#1f2937;margin:12px 0}.badge{color:#061006;background:var(--accent);padding:2px 7px;border-radius:999px;font-size:11px}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0 14px}
    button,a.btn,select,input{background:#0d1420;color:#e6edf3;border:1px solid #2a3442;border-radius:6px;padding:7px 9px;font-family:inherit;font-size:12px}button{cursor:pointer}button:hover,a.btn:hover{border-color:var(--accent);color:#fff}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #17202b;background:#070a0e;flex-wrap:wrap}.bottom{border-top:1px solid #17202b;border-bottom:0}.prompt{color:var(--accent);font-weight:bold}.path{color:#d7f7d7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}.toggle{display:inline-flex;gap:5px;align-items:center;color:#c9d1d9;font-size:12px}.toggle input{accent-color:var(--accent)}
    #console{flex:1;overflow:auto;padding:12px 14px;white-space:pre-wrap;line-height:1.38;background:#020403;font-size:12px;color:#b7f6b7;text-shadow:0 0 2px rgba(73,209,105,.15)}
    .line{display:block;margin:0 0 1px}.ts{color:#6f7b88}.INFO{color:#7ee787}.DEBUG{color:#8b949e}.WARN{color:#ffcc66}.ERROR{color:#ff6b6b}.area{color:#63d6ff}.event{color:#c9d1d9}.msg{color:#d7f7d7}.data{color:#8b949e}.status{color:var(--muted);font-size:12px}.ok{color:var(--accent)}.err{color:var(--err)}.warn{color:var(--warn)}
    .cmdline{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:8px 0}.cmdline label{font-size:11px;color:#8b949e;align-self:center}.cmdline input,.cmdline select{width:100%}
  </style>
</head>
<body>
  <aside>
    <h1>Runtime Console <span class="badge">SSE</span></h1>
    <div class="nav">
      <button onclick="newSession()">New Session</button>
      <div class="sep"></div>
      <a class="btn" href="/graph-runtime">Graph Runtime</a>
      <a class="btn" href="/runtime-console">Runtime Console</a>
      <a class="btn" href="/runtime-explorer">Runtime Explorer</a>
      <a class="btn" href="/settings">Settings</a>
    </div>
    <div class="hint">SSE-based runtime event stream. It behaves like <b>tail -f</b>:逐行显示、滚动条、自动滚动、暂停、过滤、搜索、导出。</div>
    <div class="cmdline"><label>Source</label><select id="source" onchange="restartStream()"><option value="runtime/logs/runtime_console.jsonl">runtime_console</option></select></div>
    <div class="cmdline"><label>Filter</label><input id="filter" placeholder="area / event / message" oninput="rerender()" /></div>
    <div class="cmdline"><label>Search</label><input id="search" placeholder="highlight text" oninput="rerender()" /></div>
  </aside>
  <main>
    <div class="toolbar">
      <span class="prompt">$</span><span class="path" id="current">runtime/logs/runtime_console.jsonl</span>
      <label class="toggle"><input id="autoscroll" type="checkbox" checked /> Auto Scroll</label>
      <button onclick="pauseStream()">Pause</button><button onclick="resumeStream()">Resume</button><button onclick="clearConsole()">Clear</button><button onclick="exportConsole()">Export</button>
    </div>
    <div id="console"></div>
    <div class="toolbar bottom"><span class="status" id="status">connecting</span></div>
  </main>
<script>
let source='runtime/logs/runtime_console.jsonl'; let es=null; let paused=false; let events=[];
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function setStatus(t,cls=''){const el=document.getElementById('status');el.className='status '+cls;el.textContent=t;}
async function loadSources(){try{const r=await fetch('/api/runtime-console/sources',{cache:'no-store'});const data=await r.json();const sel=document.getElementById('source');sel.innerHTML='';(data.sources||[]).forEach(s=>{const o=document.createElement('option');o.value=s.path;o.textContent=s.path;sel.appendChild(o)});sel.value=source;}catch(e){}}
function format(e){const data=e.data&&Object.keys(e.data).length?` <span class="data">${esc(JSON.stringify(e.data)).slice(0,700)}</span>`:'';return `<span class="line"><span class="ts">${esc(String(e.ts||'').replace('T',' ').replace(/\.\d+.*/,''))}</span> <span class="${esc(e.level||'INFO')}">${esc(e.level||'INFO')}</span> <span class="area">${esc(e.area||'RUNTIME')}</span> <span class="event">${esc(e.event||'EVENT')}</span> <span class="msg">${esc(e.message||'')}</span>${data}</span>`}
function rerender(){const f=document.getElementById('filter').value.toLowerCase();const q=document.getElementById('search').value.toLowerCase();let shown=events.filter(e=>!f||JSON.stringify(e).toLowerCase().includes(f)); if(q) shown=shown.filter(e=>JSON.stringify(e).toLowerCase().includes(q)); const box=document.getElementById('console');box.innerHTML=shown.map(format).join('\n'); if(document.getElementById('autoscroll').checked) box.scrollTop=box.scrollHeight; setStatus(`${shown.length}/${events.length} events · ${paused?'paused':'streaming'}`, paused?'warn':'ok');}
function connect(){if(es) es.close(); source=document.getElementById('source').value||source;document.getElementById('current').textContent=source; es=new EventSource('/api/runtime-console/stream?source='+encodeURIComponent(source)); es.addEventListener('runtime',ev=>{if(paused)return; try{events.push(JSON.parse(ev.data)); if(events.length>3000)events=events.slice(-2500); rerender();}catch(e){}}); es.onerror=()=>setStatus('stream reconnecting','warn');}
function restartStream(){events=[];rerender();connect()} function pauseStream(){paused=true;rerender()} function resumeStream(){paused=false;rerender()} function clearConsole(){events=[];rerender()}
function exportConsole(){const blob=new Blob([events.map(e=>JSON.stringify(e)).join('\n')],{type:'application/jsonl'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='runtime-console-export.jsonl';a.click();URL.revokeObjectURL(a.href)}
function newSession(){location.href='/agent-studio'}
loadSources().then(connect);
</script>
</body>
</html>
