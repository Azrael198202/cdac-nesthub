<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Runtime Console</title>
  <style>
    :root{--bg:#050608;--panel:#0d1117;--line:#253041;--text:#d8f7d8;--muted:#7f8c9a;--accent:#62d26f;--warn:#ffcc66;--err:#ff6b6b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;height:100vh;display:grid;grid-template-columns:320px 1fr;overflow:hidden}
    aside{background:#090c10;border-right:1px solid var(--line);padding:14px;overflow:auto} main{display:flex;flex-direction:column;min-width:0}
    h1{font-size:16px;margin:0 0 12px;color:#fff} .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}
    .toolbar{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line);background:var(--panel)}
    button,select,input{background:#111822;color:#e6edf3;border:1px solid #303b4a;border-radius:6px;padding:7px 9px;font-family:inherit;font-size:12px} button{cursor:pointer} button:hover{border-color:var(--accent)}
    .source{padding:9px;border:1px solid #1d2633;border-radius:8px;margin:8px 0;cursor:pointer;color:#c9d1d9;background:#0b1017;word-break:break-all}.source:hover,.source.active{border-color:var(--accent);background:#0f1a13}.meta{color:var(--muted);font-size:11px;margin-top:5px}
    #console{flex:1;overflow:auto;padding:14px;white-space:pre-wrap;line-height:1.45;background:radial-gradient(circle at top left,#10151d,#050608 40%);font-size:12px}
    .status{color:var(--muted);font-size:12px}.ok{color:var(--accent)}.err{color:var(--err)}.warn{color:var(--warn)}
    .prompt{color:var(--accent)} .toplink{color:#9ecbff;text-decoration:none;font-size:12px;margin-left:auto}.badge{color:#111;background:var(--accent);padding:2px 6px;border-radius:999px;font-size:11px}
  </style>
</head>
<body>
  <aside>
    <h1>Runtime Console <span class="badge">tail</span></h1>
    <div class="hint">Terminal-style view for runtime logs, traces, model downloads, GGUF imports, capability acquisition, and tool execution. Secrets are redacted by the API.</div>
    <button onclick="loadSources()">refresh sources</button>
    <button onclick="clearConsole()">clear view</button>
    <div id="sources"></div>
  </aside>
  <main>
    <div class="toolbar">
      <span class="prompt">$</span>
      <span id="current">runtime/logs/runtime_console.jsonl</span>
      <label><input id="auto" type="checkbox" checked /> auto refresh</label>
      <button onclick="tailSelected(true)">tail</button>
      <button onclick="tailSelected(false)">read next</button>
      <a class="toplink" href="/agent-studio">Agent Studio</a>
    </div>
    <div id="console"></div>
    <div class="toolbar"><span class="status" id="status">ready</span></div>
  </main>
<script>
let selected='runtime/logs/runtime_console.jsonl';
let cursor=0; let timer=null;
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function setStatus(t,cls=''){const el=document.getElementById('status');el.className='status '+cls;el.textContent=t;}
async function api(url){const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(await r.text()); return r.json();}
async function loadSources(){
  try{const data=await api('/api/runtime-console/sources'); const box=document.getElementById('sources'); box.innerHTML='';
    (data.sources||[]).forEach(s=>{const d=document.createElement('div'); d.className='source '+(s.path===selected?'active':''); d.onclick=()=>selectSource(s.path); d.innerHTML='<div>'+esc(s.path)+'</div><div class="meta">'+esc(s.type)+' · '+(s.size_bytes||0)+' bytes</div>'; box.appendChild(d);});
    setStatus('sources loaded: '+(data.sources||[]).length,'ok');
  }catch(e){setStatus('source load failed: '+e.message,'err')}
}
function selectSource(path){selected=path;cursor=0;document.getElementById('current').textContent=path;document.getElementById('console').textContent='';loadSources();tailSelected(true);}
function clearConsole(){document.getElementById('console').textContent='';}
async function tailSelected(tail){
  try{const url='/api/runtime-console/read?source='+encodeURIComponent(selected)+'&cursor='+cursor+'&limit_bytes=65536&tail='+(tail?'true':'false'); const data=await api(url);
    if(!data.ok){setStatus(data.status||'not found','warn'); return;}
    cursor=data.next_cursor||cursor; const c=document.getElementById('console'); const text=data.content||'';
    if(tail) c.textContent='';
    if(text){c.textContent += text; c.scrollTop=c.scrollHeight;}
    setStatus('cursor '+cursor+' / '+(data.size_bytes||0)+' · '+new Date().toLocaleTimeString(),'ok');
  }catch(e){setStatus('read failed: '+e.message,'err')}
}
setInterval(()=>{if(document.getElementById('auto').checked) tailSelected(false)},2000);
loadSources().then(()=>tailSelected(true));
</script>
</body>
</html>
