<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NestHub Runtime Settings</title>
  <style>
    :root{color-scheme:dark;--bg:#0f172a;--panel:#111827;--card:#1f2937;--line:#334155;--text:#e5e7eb;--muted:#93c5fd;--accent:#0ea5e9;--ok:#22c55e;--warn:#f59e0b;}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}.sub{color:#bfdbfe;font-size:12px;margin-top:4px}.btn{border:0;border-radius:10px;background:#334155;color:white;padding:9px 13px;font-weight:700;cursor:pointer;text-decoration:none}.btn.primary{background:#0369a1}.btn.ok{background:#047857}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:14px;height:calc(100vh - 78px)}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;min-height:0;display:flex;flex-direction:column}.panel h2{font-size:14px;margin:0;padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.scroll{overflow:auto;padding:12px;min-height:0;flex:1}.tool{border:1px solid var(--line);border-radius:12px;background:#0b1220;padding:10px;margin-bottom:10px;cursor:pointer}.tool.active{border-color:#22c55e;background:#10231a}.toolName{font-weight:800}.small{font-size:12px;color:#bfdbfe}.muted{color:#94a3b8}.card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;color:#bfdbfe;margin-bottom:5px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#020617;color:var(--text);padding:9px}.textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;margin:3px 4px 0 0;color:#bae6fd;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.toast{position:fixed;right:20px;bottom:20px;background:#064e3b;border:1px solid #22c55e;color:#dcfce7;padding:10px 14px;border-radius:10px}.pre{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#020617;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
  </style>
</head>
<body>
<header><div><h1>NestHub Runtime Settings</h1><div class="sub">Configure runtime-generated tools, profiles, secrets, and approval policy outside task execution.</div></div><div class="row"><a class="btn" href="/" target="_blank">Agent Studio</a><button class="btn primary" onclick="loadSettings()">Refresh</button></div></header>
<div class="layout">
  <section class="panel"><h2>Registered tools <span id="toolCount" class="small"></span></h2><div id="toolList" class="scroll"><div class="muted">Loading...</div></div></section>
  <section class="panel"><h2>Tool settings <span id="selectedToolTitle" class="small"></span></h2><div class="scroll" id="detail"><div class="muted">Select a registered tool.</div></div></section>
</div>
<script>
let state={tools:[],profiles:[],approval_policies:[]};
let selectedToolId='';
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(url, options){const res=await fetch(url,options||{});const text=await res.text();let data={};try{data=text?JSON.parse(text):{};}catch(e){data={ok:false,error:text};}if(!res.ok||data.ok===false){throw new Error((data.error&&data.error.message)||data.error||data.message||('HTTP '+res.status));}return data;}
function showToast(t){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
async function loadSettings(){state=await api('/api/runtime/settings');renderToolList();if(selectedToolId){renderDetail(selectedToolId);} }
function renderToolList(){const list=document.getElementById('toolList');document.getElementById('toolCount').textContent=String((state.tools||[]).length);if(!state.tools||!state.tools.length){list.innerHTML='<div class="muted">No tools registered.</div>';return;}list.innerHTML=state.tools.map(t=>{const status=t.configuration_status||{};const approval=t.approval_settings||{};return `<div class="tool ${selectedToolId===t.tool_id?'active':''}" onclick="renderDetail('${escapeHtml(t.tool_id)}')"><div class="toolName">${escapeHtml(t.name||t.tool_id)}</div><div class="small">${escapeHtml(t.tool_id)} · ${escapeHtml(t.status||'')}</div><div><span class="pill">configured: ${!!status.configured}</span><span class="pill">approval: ${escapeHtml(approval.mode||'always')}</span></div></div>`}).join('');}
function props(schema){return (schema&&schema.properties&&typeof schema.properties==='object')?schema.properties:{};}
function getProfile(toolId){return (state.profiles||[]).find(p=>p.tool_id===toolId&&p.profile_id==='default')||{};}
function getPolicy(toolId){return (state.approval_policies||[]).find(p=>p.tool_id===toolId&&p.profile_id==='default')||{};}
function renderDetail(toolId){selectedToolId=toolId;renderToolList();const t=(state.tools||[]).find(x=>x.tool_id===toolId);if(!t){return;}document.getElementById('selectedToolTitle').textContent=toolId;const profile=getProfile(toolId);const policy=getPolicy(toolId);const conn=profile.config||{};const secretConfigured=profile.secret_configured||{};const connProps=props(t.connection_schema);const secProps=props(t.secret_schema);let html=`<div class="card"><h3 style="margin-top:0">${escapeHtml(t.name||t.tool_id)}</h3><div class="small">${escapeHtml(t.capability||'')}</div><div class="row"><span class="pill">status: ${escapeHtml(t.status||'')}</span><span class="pill">executable: ${!!t.executable}</span><span class="pill">profile: default</span></div></div>`;
html+=`<div class="card"><h3>Approval policy</h3><div class="small">Controls confirmation before external/runtime execution. Existing task UI will read this policy.</div><div class="field"><label>Mode</label><select id="approvalMode" class="select"><option value="always">Always ask: require Confirm execution every time</option><option value="once">Ask once: trust after explicit confirmation</option><option value="never">Never ask: auto-confirm this tool/profile</option></select></div><div class="row"><button class="btn ok" onclick="saveApprovalPolicy()">Save approval policy</button><span class="small">current: ${escapeHtml(policy.mode||'always')}${policy.trusted?' · trusted':''}</span></div></div>`;
html+=`<div class="card"><h3>Connection profile</h3><div class="small">Non-secret values are saved in the runtime connection profile. Secret fields are saved into the local runtime secret store.</div><div class="grid">`;
Object.keys(connProps).forEach(k=>{html+=`<div class="field"><label>${escapeHtml(k)}</label><input id="conn_${escapeHtml(k)}" class="input" value="${escapeHtml(conn[k]??'')}" placeholder="${escapeHtml(k)}" /></div>`});
Object.keys(secProps).forEach(k=>{html+=`<div class="field"><label>${escapeHtml(k)} ${secretConfigured[k]?'(configured)':''}</label><input id="secret_${escapeHtml(k)}" type="password" class="input" value="" placeholder="leave blank to keep existing" /></div>`});
html+=`</div><div class="row"><button class="btn ok" onclick="saveProfile()">Save profile</button></div></div>`;
html+=`<div class="card"><h3>Schemas</h3><div class="pre">${escapeHtml(JSON.stringify({input_schema:t.input_schema||{},connection_schema:t.connection_schema||{},secret_schema:t.secret_schema||{},approval_policy:t.approval_policy||{},runtime_execution_policy:t.runtime_execution_policy||{}},null,2))}</div></div>`;
document.getElementById('detail').innerHTML=html;document.getElementById('approvalMode').value=(policy.mode||'always');}
async function saveApprovalPolicy(){const mode=document.getElementById('approvalMode').value;await api('/api/runtime/settings/tool-approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool_id:selectedToolId,profile_id:'default',mode})});showToast('Approval policy saved');await loadSettings();}
async function saveProfile(){const t=(state.tools||[]).find(x=>x.tool_id===selectedToolId);if(!t)return;const connProps=props(t.connection_schema);const secProps=props(t.secret_schema);const config={};const secrets={};Object.keys(connProps).forEach(k=>{const el=document.getElementById('conn_'+k);if(el)config[k]=el.value;});Object.keys(secProps).forEach(k=>{const el=document.getElementById('secret_'+k);if(el&&el.value)secrets[k]=el.value;});await api('/api/agent-studio/runtime-tool-profiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tool_id:selectedToolId,profile_id:'default',config,secrets})});showToast('Profile saved');await loadSettings();}
loadSettings().catch(e=>{document.getElementById('toolList').innerHTML='<div class="muted">'+escapeHtml(e.message)+'</div>';});
</script>
</body>
</html>
