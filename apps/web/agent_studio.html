<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runtime Agent Studio</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --panel:#111827; --card:#1f2937; --line:#334155; --text:#e5e7eb; --muted:#93c5fd; --accent:#0ea5e9; --danger:#991b1b; }
    *{box-sizing:border-box} html,body{height:100%;overflow:hidden} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px}
    header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);gap:12px;overflow:hidden}
    h1{font-size:18px;margin:0 0 4px}.sub{color:#a5b4fc;font-size:12px}.status{color:#bae6fd;display:flex;align-items:center;gap:8px}.status.running::before{content:'';width:10px;height:10px;border:2px solid #38bdf8;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.btn{border:0;border-radius:10px;background:#334155;color:white;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:#0369a1}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.6;cursor:not-allowed}
    main{display:grid;grid-template-columns:minmax(0,26fr) minmax(0,44fr) minmax(0,30fr);gap:10px;height:calc(100vh - 82px);padding:10px;overflow:hidden;min-width:0}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}.panel h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.scroll{padding:12px;overflow:auto;min-height:0;flex:1}.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.pill{display:inline-block;margin:3px 4px 0 0;padding:3px 7px;border-radius:999px;background:#0f766e;color:#ccfbf1;font-size:12px}.path{color:#93c5fd;font-size:12px;word-break:break-all}.console{border-top:1px solid var(--line);padding:12px;background:#0b1220}.input{width:100%;height:72px;border:1px solid var(--line);border-radius:10px;background:#020617;color:var(--text);padding:10px;resize:none}.row{display:flex;gap:8px;margin-top:10px}.message{white-space:pre-wrap}.user{border-color:#0ea5e9}.error{border-color:#f59e0b}.final{border-color:#22c55e}.pre{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#020617;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:220px;max-width:100%}.small{font-size:12px;color:#bfdbfe}.sectionTitle{color:#bfdbfe;font-weight:700;margin:12px 0 8px}.empty{color:#94a3b8;font-size:13px}.cardHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.copyBtn{border:1px solid var(--line);border-radius:8px;background:#0b1220;color:#bfdbfe;padding:4px 8px;cursor:pointer;font-size:12px}.copyBtn:hover{border-color:#38bdf8;color:#e0f2fe}.toast{position:fixed;right:20px;bottom:20px;background:#064e3b;border:1px solid #22c55e;color:#dcfce7;padding:10px 14px;border-radius:10px;z-index:50}.progressLine{display:flex;align-items:center;gap:8px;margin:6px 0;color:#bfdbfe}.progressDot{width:8px;height:8px;border-radius:999px;background:#38bdf8;animation:pulse 1.2s ease-in-out infinite}.progressDot.done{background:#22c55e;animation:none}.progressDot.wait{background:#f59e0b;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
    .modalBackdrop{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;z-index:80}.modalBackdrop.show{display:flex}.modal{width:min(720px,92vw);max-height:86vh;overflow:auto;background:#111827;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:18px}.modal h3{margin:0 0 6px;font-size:18px}.fieldLabel{display:block;margin:14px 0 6px;font-weight:700;color:#bfdbfe}.fieldHint{font-size:12px;color:#cbd5e1;white-space:pre-wrap}.fieldInput{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#020617;color:var(--text);padding:10px}.fieldInput.area{min-height:110px;font-family:ui-monospace,Consolas,monospace}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:#bae6fd;font-size:12px}.modelBar{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;max-width:720px;min-width:0}.modelGroup{display:flex;align-items:center;gap:5px;background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:6px 8px;white-space:nowrap}.modelGroup label{font-size:12px;color:#bfdbfe}.modelSelect{background:#020617;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;max-width:280px;min-width:220px}.radioGroup{display:flex;gap:8px;align-items:center}.radioGroup label{font-size:12px;color:#e0f2fe;white-space:nowrap}.modelHint{width:100%;text-align:right;font-size:11px;color:#93c5fd;line-height:1.1}
  </style>
</head>
<body>
<header>
  <div><h1>Runtime Agent Studio</h1><div class="sub">Auxiliary layer manages participants and tasks. Primary runtime executes delegated work.</div></div>
  <div class="modelBar">
    <div class="modelGroup radioGroup">
      <label><input type="radio" name="modelMode" value="local_only" onchange="onModelModeChanged()"> Local only</label>
      <label><input type="radio" name="modelMode" value="api_only" onchange="onModelModeChanged()"> API only</label>
      <label><input type="radio" name="modelMode" value="hybrid" onchange="onModelModeChanged()"> Hybrid</label>
    </div>
    <div class="modelGroup"><label id="modelSelectLabel" for="initialModelSelect">Initial model</label><select id="initialModelSelect" class="modelSelect" onchange="saveModelSelection()"></select></div>
    <button class="btn" onclick="refreshState()">Refresh</button>
    <div class="status" id="status">ready</div>
    <div id="modelPolicyHint" class="modelHint"></div>
  </div>
</header>
<main>
  <section class="panel"><h2>Interactive Console <span id="profileCount" class="small"></span></h2><div class="scroll" id="messages"></div><div class="console"><textarea id="input" class="input" placeholder="Enter a message, request, or runtime instruction."></textarea><div class="row"><button id="sendBtn" class="btn primary" onclick="sendMessage()">Send</button><button class="btn" onclick="quickExecute()">Execute Named Task</button></div></div></section>
  <section class="panel"><h2>Generated Participants <span id="participantCount" class="small"></span></h2><div class="scroll" id="participants"></div></section>
  <section class="panel"><h2>Workflow / Results / Traces <span id="graphCount" class="small"></span></h2><div class="scroll" id="rightPane"></div></section>
</main>
<div id="missingInputModal" class="modalBackdrop"><div class="modal"><h3>Required input</h3><div class="small" id="missingInputSummary"></div><div id="missingInputFields"></div><div class="modalActions"><button class="btn" onclick="closeMissingInputModal()">Cancel</button><button id="skipCredentialBtn" class="btn" style="display:none" onclick="skipCredentialAndContinue()">Continue without this key</button><button class="btn primary" onclick="submitMissingInputs()">Submit & Continue</button></div></div></div>
<script>
const messages = document.getElementById('messages');
function renderJson(obj){ return JSON.stringify(obj, null, 2); }
function addMessage(text, cls='item') { const el=document.createElement('div'); el.className=cls; el.innerHTML=`<div class="message">${escapeHtml(text)}</div>`; messages.appendChild(el); messages.scrollTop=messages.scrollHeight; }
function renderStudioResponse(data, originalText){
  if(data && (data.action==='conversation_message' || data.action==='model_preflight')){
    const answer = data.final_answer || data.message || '';
    addMessage(answer || '(no answer)', data.status==='blocked' ? 'item error' : 'item final');
    return;
  }
  addMessage(renderJson(data), data && data.status==='completed' ? 'item' : 'item error');
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setStudioStatus(text, running=false){ const el=document.getElementById('status'); el.textContent=text; el.classList.toggle('running', !!running); }
function addProgressMessage(text){ addMessage('Progress: '+text, 'item'); }
let lastSubmittedInstruction = '';
let lastMissingInputs = [];
let lastPendingRunId = '';
let lastPendingInstruction = '';
let modelSelectionState = null;
let suppressModelSave = false;

async function sendMessage(){
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text)return;
  lastSubmittedInstruction=text;
  lastPendingInstruction=text;
  const canStart = await ensureSelectedModelCredential();
  if(!canStart){ return; }
  input.value='';
  addMessage(text,'item user');
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;
  btn.textContent='Thinking...';
  setStudioStatus('running', true);
  let pollTimer=null;
  let hintTimer=null;
  const hints=[
    'receiving instruction',
    'routing command',
    'selecting response path',
    'calling selected runtime',
    'waiting for result',
    'refreshing state'
  ];
  let hintIndex=0;
  try{
    addProgressMessage(hints[hintIndex++]);
    pollTimer=setInterval(()=>refreshState(), 1200);
    hintTimer=setInterval(()=>{
      if(hintIndex<hints.length){ addProgressMessage(hints[hintIndex++]); }
    }, 2500);
    const res=await fetch('/api/agent-studio/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await res.json();
    renderStudioResponse(data, text);
    const pendingItems = collectMissingInputs(data);
    if(pendingItems.length){ lastMissingInputs=pendingItems; lastPendingRunId=data.run_id||''; lastPendingInstruction=text; addMissingInputs(pendingItems, text, lastPendingRunId); }
    if(data.action!=='conversation_message' && data.final_answer){ addMessage('Final Answer:\n'+data.final_answer,'item final'); }
    await refreshState();
  }catch(e){
    addMessage('Error: '+e,'item error');
  } finally{
    if(pollTimer) clearInterval(pollTimer);
    if(hintTimer) clearInterval(hintTimer);
    btn.disabled=false;
    btn.textContent='Send';
    setStudioStatus('ready', false);
  }
}
function addMissingInputs(items, pendingInstruction, runId){
  lastMissingInputs = Array.isArray(items) ? items : [];
  lastPendingInstruction = pendingInstruction || lastPendingInstruction || lastSubmittedInstruction || '';
  if(runId){ lastPendingRunId = runId; }
  openMissingInputModal(lastMissingInputs, lastPendingRunId);
}
function openMissingInputModal(items, runId){
  const modal=document.getElementById('missingInputModal');
  const fields=document.getElementById('missingInputFields');
  const summary=document.getElementById('missingInputSummary');
  fields.innerHTML='';
  const safeItems=Array.isArray(items)?items:[];
  const hasCredentialChoice = safeItems.some(it => ['secret_input','optional_credential_choice'].includes(String(it.kind||'')));
  const skipBtn=document.getElementById('skipCredentialBtn');
  if(skipBtn){ skipBtn.style.display = hasCredentialChoice ? 'inline-block' : 'none'; }
  summary.innerHTML=`<span class="badge">run: ${escapeHtml(runId||lastPendingRunId||'pending')}</span> ${safeItems.length} field(s) need input before runtime can continue.`;
  safeItems.forEach((it,idx)=>{
    const kind=String(it.kind||'human_information_required');
    const field=String(it.field||it.name||('field_'+idx));
    const message=String(it.message||'Please provide this value.');
    const validation=String(it.validation_error||'');
    const provider=String(it.provider || (it.api_source&&it.api_source.provider) || '');
    const sourceUrl=String(it.source_url || (it.api_source&&it.api_source.url) || '');
    const sourceList=Array.isArray(it.api_sources) ? it.api_sources : [];
    const wrap=document.createElement('div');
    const label=document.createElement('label');
    label.className='fieldLabel';
    label.textContent=field;
    const hint=document.createElement('div');
    hint.className='fieldHint';
    let sourceText='';
    if(provider || sourceUrl){ sourceText += '\nAPI / Provider: ' + (provider || 'credential-protected provider'); }
    if(sourceUrl){ sourceText += '\nSource: ' + sourceUrl; }
    if(sourceList.length){
      const names=sourceList.slice(0,3).map(x=>String((x&&x.provider)|| (x&&x.name) || (x&&x.url) || '')).filter(Boolean);
      if(names.length){ sourceText += '\nCandidate sources: ' + names.join(' | '); }
    }
    hint.textContent=message + sourceText + (validation ? '\n\nValidation error:\n' + validation : '');
    const inputType=String(it.input_type||'');
    const area = inputType==='textarea' || (kind==='validation_recovery' && field==='corrected_json');
    const input=document.createElement(area?'textarea':'input');
    if(!area && (inputType==='password' || kind==='secret_input' || kind==='optional_credential_choice')){ input.type='password'; input.autocomplete='off'; }
    input.id='missing_form_'+idx;
    input.className='fieldInput '+(area?'area':'');
    input.dataset.field=field;
    input.dataset.kind=kind;
    input.dataset.inputType=inputType;
    input.dataset.values='[]';
    input.placeholder=inputType==='list' ? 'Enter one value, then click Continue or Done' : field;
    wrap.appendChild(label);
    wrap.appendChild(hint);
    wrap.appendChild(input);
    if(inputType==='list'){
      const chips=document.createElement('div');
      chips.className='small';
      chips.id='missing_values_'+idx;
      chips.style.marginTop='6px';
      const actions=document.createElement('div');
      actions.className='row';
      const addBtn=document.createElement('button');
      addBtn.type='button';
      addBtn.className='btn';
      addBtn.textContent='Continue / add value';
      addBtn.onclick=()=>addListValue(input, chips);
      const doneBtn=document.createElement('button');
      doneBtn.type='button';
      doneBtn.className='btn primary';
      doneBtn.textContent='Done for this parameter';
      doneBtn.onclick=()=>addListValue(input, chips);
      actions.appendChild(addBtn);
      actions.appendChild(doneBtn);
      wrap.appendChild(chips);
      wrap.appendChild(actions);
    }
    fields.appendChild(wrap);
    if(!area){ input.addEventListener('keydown', (event)=>{ if(event.key==='Enter'){ event.preventDefault(); if(inputType==='list'){ addListValue(input, document.getElementById('missing_values_'+idx)); } else { submitMissingInputs(); } }}); }
  });
  modal.classList.add('show');
}

function addListValue(input, chips){
  if(!input){ return; }
  const raw=input.value.trim();
  let values=[];
  try{ values=JSON.parse(input.dataset.values||'[]'); }catch(e){ values=[]; }
  if(raw){ values.push(raw); input.value=''; }
  input.dataset.values=JSON.stringify(values);
  if(chips){ chips.textContent = values.length ? ('Values: ' + values.join(' | ')) : 'No values added yet.'; }
}

function closeMissingInputModal(){ document.getElementById('missingInputModal').classList.remove('show'); }
async function skipCredentialAndContinue(){
  closeMissingInputModal();
  const provided={action:'skip_credential', choice:'skip_credential', skip_credential:true, credential_mode:'skip'};
  if(lastPendingRunId){
    await resumePendingRun(lastPendingRunId, provided);
    return;
  }
  const text=lastPendingInstruction || lastSubmittedInstruction;
  if(text){
    const res=await fetch('/api/agent-studio/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text, provided_inputs:provided})});
    const data=await res.json();
    renderStudioResponse(data, text);
    await refreshState();
  }
}
async function submitMissingInputs(){
  const provided={};
  const inputs=document.querySelectorAll('[id^="missing_form_"]');
  inputs.forEach(input=>{
    const field=(input.dataset.field||'').trim();
    const kind=(input.dataset.kind||'').trim();
    const inputType=(input.dataset.inputType||'').trim();
    let value=input.value.trim();
    if(!field){ return; }
    if(inputType==='list'){
      let values=[];
      try{ values=JSON.parse(input.dataset.values||'[]'); }catch(e){ values=[]; }
      if(value){ values.push(value); }
      value=values;
    }
    if(kind==='secret_input' || kind==='optional_credential_choice'){
      provided.secret_key=field;
      provided.value=Array.isArray(value) ? value.join(',') : value;
    } else {
      provided[field]=value;
    }
  });
  const hasValue=Object.values(provided).some(v=>Array.isArray(v) ? v.length>0 : String(v||'').trim()!=='');
  if(!hasValue){ addMessage('Please enter at least one value before continuing.','item error'); return; }
  closeMissingInputModal();
  if(provided.secret_key && provided.value){
    await saveRuntimeSecret(provided.secret_key, provided.value);
  }
  if(lastPendingRunId){ await resumePendingRun(lastPendingRunId, provided); return; }
  const text=lastPendingInstruction || lastSubmittedInstruction;
  if(text){
    const res=await fetch('/api/agent-studio/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text, provided_inputs:provided})});
    const data=await res.json();
    addMessage(renderJson(data), data.status==='completed'?'item':'item error');
    await refreshState();
  }
}
async function saveRuntimeSecret(key, value){
  const cleanKey=String(key||'').trim();
  const cleanValue=String(value||'').trim();
  if(!cleanKey || !cleanValue){ return; }
  const res=await fetch('/api/agent-studio/secret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:cleanKey,value:cleanValue})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok || data.ok===false){ throw new Error(data.message || 'Failed to save runtime secret.'); }
  addProgressMessage('runtime secret saved');
}

async function resumePendingRun(runId, providedInputs){
  if(!runId)return;
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;
  btn.textContent='Thinking...';
  setStudioStatus('running', true);
  let pollTimer=null;
  try{
    if(providedInputs && providedInputs.secret_key && providedInputs.value){
      await saveRuntimeSecret(providedInputs.secret_key, providedInputs.value);
    }
    addProgressMessage('resuming suspended delegated run');
    pollTimer=setInterval(()=>refreshState(), 1200);
    const res=await fetch('/api/agent-studio/resume-run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:runId, provided_inputs:providedInputs||null})});
    const data=await res.json();
    addMessage(renderJson(data), data.status==='completed'?'item':'item error');
    const pendingItems = collectMissingInputs(data);
    if(pendingItems.length){ lastMissingInputs=pendingItems; lastPendingRunId=data.run_id||runId; addMissingInputs(pendingItems, lastPendingInstruction, lastPendingRunId); }
    if(data.final_answer){ addMessage('Final Answer:\n'+data.final_answer,'item final'); }
    await refreshState();
  }catch(e){ addMessage('Resume failed: '+e,'item error'); }
  finally{
    if(pollTimer) clearInterval(pollTimer);
    btn.disabled=false;
    btn.textContent='Send';
    setStudioStatus('ready', false);
  }
}
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    showToast('Copied');
  }catch(e){
    showToast('Copy failed');
  }
}
function showToast(text){
  const old=document.querySelector('.toast');
  if(old) old.remove();
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1600);
}

async function loadModelSelection(){
  try{
    const res=await fetch('/api/agent-studio/model-selection');
    const data=await res.json();
    modelSelectionState=data;
    renderModelSelection(data);
  }catch(e){ console.error(e); }
}
function optionText(item){
  const label=item.label || item.model_id || 'model';
  const parts=[label];
  if(item.provider) parts.push(item.provider);
  if(item.cost_class) parts.push(item.cost_class);
  return parts.join(' / ');
}
function fillSelect(select, items, value){
  select.innerHTML='';
  (items||[]).forEach(item=>{
    const opt=document.createElement('option');
    opt.value=item.model_id;
    opt.textContent=optionText(item);
    opt.dataset.family=item.family || '';
    opt.dataset.provider=item.provider || '';
    if(item.requires_secret){ opt.dataset.secret=item.requires_secret; }
    select.appendChild(opt);
  });
  if(value && Array.from(select.options).some(o=>o.value===value)){ select.value=value; }
  else if(select.options.length){ select.selectedIndex=0; }
}
function modelListForMode(mode, models){
  if(mode==='local_only'){ return models.local || []; }
  if(mode==='api_only'){ return models.api || []; }
  return models.all || [];
}
function defaultModelForMode(mode, selection){
  if(mode==='local_only'){ return selection.selected_local_model_id || 'qwen3:8b'; }
  if(mode==='api_only'){ return selection.selected_api_model_id || 'gpt-4o-mini'; }
  return selection.initial_model_id || selection.selected_api_model_id || selection.selected_local_model_id || '';
}
function selectedOptionMeta(){
  const select=document.getElementById('initialModelSelect');
  const opt=select.options[select.selectedIndex];
  return {
    model_id: select.value || '',
    family: opt ? (opt.dataset.family || '') : '',
    provider: opt ? (opt.dataset.provider || '') : '',
    secret: opt ? (opt.dataset.secret || '') : ''
  };
}
function renderModelSelection(data){
  const selection=(data&&data.selection)||{};
  const models=(data&&data.available_models)||{};
  const mode=selection.mode||'api_only';
  suppressModelSave=true;
  document.querySelectorAll('input[name="modelMode"]').forEach(r=>{ r.checked = r.value === mode; });
  const items=modelListForMode(mode, models);
  const preferred=defaultModelForMode(mode, selection);
  fillSelect(document.getElementById('initialModelSelect'), items, preferred);
  const label=document.getElementById('modelSelectLabel');
  if(label){ label.textContent = mode==='local_only' ? 'Local model' : (mode==='api_only' ? 'API model' : 'Initial model'); }
  const hint=document.getElementById('modelPolicyHint');
  const selected=selectedOptionMeta();
  hint.textContent = `Mode: ${mode}; selected: ${selected.model_id || selection.initial_model_id || ''}; provider: ${selected.provider || selection.initial_provider || ''}; escalation: ${selection.allow_escalation ? 'enabled' : 'disabled'}`;
  suppressModelSave=false;
}
function currentModelMode(){
  const checked=document.querySelector('input[name="modelMode"]:checked');
  return checked ? checked.value : 'api_only';
}
async function onModelModeChanged(){
  if(!modelSelectionState){ return; }
  const mode=currentModelMode();
  const selection=(modelSelectionState&&modelSelectionState.selection)||{};
  const models=(modelSelectionState&&modelSelectionState.available_models)||{};
  suppressModelSave=true;
  const items=modelListForMode(mode, models);
  fillSelect(document.getElementById('initialModelSelect'), items, defaultModelForMode(mode, selection));
  const label=document.getElementById('modelSelectLabel');
  if(label){ label.textContent = mode==='local_only' ? 'Local model' : (mode==='api_only' ? 'API model' : 'Initial model'); }
  suppressModelSave=false;
  await saveModelSelection();
}
async function saveModelSelection(){
  if(suppressModelSave){ return; }
  const mode=currentModelMode();
  const meta=selectedOptionMeta();
  let selectedLocal=(modelSelectionState&&modelSelectionState.selection&&modelSelectionState.selection.selected_local_model_id) || 'qwen3:8b';
  let selectedApi=(modelSelectionState&&modelSelectionState.selection&&modelSelectionState.selection.selected_api_model_id) || 'gpt-4o-mini';
  if(meta.family==='local' || mode==='local_only'){ selectedLocal = meta.model_id || selectedLocal; }
  if(meta.family==='api' || mode==='api_only'){ selectedApi = meta.model_id || selectedApi; }
  const payload={
    mode,
    selected_local_model_id: selectedLocal,
    selected_api_model_id: selectedApi,
    initial_model_id: meta.model_id || '',
    allow_escalation: true,
    ask_for_missing_keys_at_start: true
  };
  if(mode==='local_only'){ payload.selected_local_model_id=payload.initial_model_id || selectedLocal; }
  if(mode==='api_only'){ payload.selected_api_model_id=payload.initial_model_id || selectedApi; }
  const res=await fetch('/api/agent-studio/model-selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await res.json();
  modelSelectionState=data;
  renderModelSelection(data);
}
async function ensureSelectedModelCredential(){
  await saveModelSelection();
  const data=modelSelectionState;
  if(!data || !data.secret_prompt_required){ return true; }
  const key=data.required_secret;
  if(!key){ return true; }
  openMissingInputModal([{kind:'secret_input', field:key, input_type:'password', message:'The selected initial API model requires a credential. Enter the key to continue, or cancel to stop this run.', provider:(data.selection&&data.selection.initial_provider)||'api provider'}], 'model_selection');
  return false;
}

function quickExecute(){ const name=prompt('Task name to execute'); if(name){ document.getElementById('input').value='execute '+name; sendMessage(); }}
async function refreshState(){ try{ const res=await fetch('/api/agent-studio/state'); const data=await res.json(); renderState(data); }catch(e){ console.error(e); }}
function renderState(data){
  const ps=data.participants||[]; document.getElementById('participantCount').textContent=ps.length; const pbox=document.getElementById('participants'); pbox.innerHTML=''; if(!ps.length)pbox.innerHTML='<div class="empty">No participant.</div>'; ps.forEach(p=>{ const el=document.createElement('div'); el.className='item'; el.innerHTML=`<b>${escapeHtml(p.name||p.participant_id)}</b><div class="small">${escapeHtml(p.participant_id||'')}</div><span class="pill">${escapeHtml(p.status||'created')}</span><span class="pill">delegate_to_ai_core</span><div class="path">${escapeHtml(p._path||'')}</div>`; pbox.appendChild(el); });
  const right=document.getElementById('rightPane'); const graphs=data.task_graphs||[]; const runs=data.task_runs||[]; const deliveries=data.deliveries||[]; const traces=data.traces||[]; document.getElementById('graphCount').textContent=graphs.length; right.innerHTML='';
  right.insertAdjacentHTML('beforeend','<div class="sectionTitle">Task Graphs</div>'); if(!graphs.length) right.insertAdjacentHTML('beforeend','<div class="empty">No task graph.</div>'); graphs.forEach(g=>right.appendChild(card(g.task_name||g.graph_id, renderJson(g))));
  right.insertAdjacentHTML('beforeend','<div class="sectionTitle">Delegation Runs</div>'); if(!runs.length) right.insertAdjacentHTML('beforeend','<div class="empty">No run.</div>'); runs.forEach(r=>right.appendChild(runCard(r)));
  right.insertAdjacentHTML('beforeend','<div class="sectionTitle">Deliveries</div>'); if(!deliveries.length) right.insertAdjacentHTML('beforeend','<div class="empty">No delivery.</div>'); deliveries.forEach(d=>right.appendChild(card(d.delivery_id||'delivery', d.final_answer || renderJson(d))));
  right.insertAdjacentHTML('beforeend','<div class="sectionTitle">Runtime Traces</div>'); if(!traces.length) right.insertAdjacentHTML('beforeend','<div class="empty">No trace.</div>'); traces.forEach(t=>right.appendChild(card(t.trace_id||'trace', renderJson(t))));
}

function collectMissingInputs(payload){
  if(!payload || typeof payload !== 'object'){ return []; }
  if(Array.isArray(payload.missing_inputs) && payload.missing_inputs.length){ return payload.missing_inputs; }
  const derived = deriveMissingInputs(payload);
  return Array.isArray(derived) ? derived : [];
}

function deriveMissingInputs(run){
  if(Array.isArray(run.missing_inputs) && run.missing_inputs.length){ return run.missing_inputs; }
  const pending=run.pending_action||{};
  const kind=String(pending.kind||'');
  if(!kind){ return []; }
  if(kind==='validation_recovery'){
    const err=String(pending.validation_error||'');
    let field='corrected_json';
    const m=err.match(/On instance\['([^']+)'\](?:\[(\d+)\])?\['([^']+)'\]/);
    if(m){ field=m[1]+(m[2]!==undefined?'.'+m[2]:'')+'.'+m[3]; }
    return [{kind:'validation_recovery', field, message:'Schema validation failed. Please provide a valid value.', validation_error:err}];
  }
  if(kind==='secret_input' || kind==='optional_credential_choice'){
    const request = pending.request || {};
    const secretFields = Array.isArray(request.secret_fields) ? request.secret_fields : [];
    const firstSecret = secretFields.length ? secretFields[0] : {};
    const apiSource = request.api_source || {};
    const apiSources = Array.isArray(request.api_sources) ? request.api_sources : [];
    const provider = apiSource.provider || firstSecret.provider || request.provider || pending.provider || 'credential-protected provider';
    const sourceUrl = apiSource.url || firstSecret.source_url || pending.source_url || '';
    const fieldName = firstSecret.name || apiSource.secret_key || pending.secret_key || 'runtime_access_key';
    return [{kind:kind, field:String(fieldName), message:String(pending.message||request.message||'A credential-protected method is available. Enter a key to use it, or continue without this key to try another allowed method.'), input_type:'password', provider:String(provider), source_url:String(sourceUrl), api_source:apiSource, api_sources:apiSources}];
  }
  if(kind==='human_information_required' || kind==='agent_parameter_collection'){
    const request = pending.request || {};
    const fields = Array.isArray(request.fields) ? request.fields : [];
    if(fields.length){
      return fields.map((f,idx)=>({
        kind:String(f.kind||kind),
        field:String(f.name||f.field||('field_'+idx)),
        message:String(f.message||f.label||request.message||'Please provide this value.'),
        input_type:String(f.input_type||'text'),
        participant_name:String(f.participant_name||''),
        parameter_name:String(f.parameter_name||'')
      }));
    }
    return [{kind:kind, field:'input', message:String(request.message||pending.message||'Please provide the required information.')}];
  }
  return [];
}

function runCard(r){
  const el=document.createElement('div');
  el.className='item';
  const jsonText=renderJson(r);
  const header=document.createElement('div');
  header.className='cardHeader';
  const left=document.createElement('div');
  left.innerHTML=`<b>${escapeHtml(r.run_id||'run')}</b> <span class="pill">${escapeHtml(r.status||'unknown')}</span>`;
  const copy=document.createElement('button');
  copy.className='copyBtn';
  copy.textContent='📋 Copy';
  copy.onclick=()=>copyText(jsonText);
  header.appendChild(left);
  header.appendChild(copy);
  el.appendChild(header);
  const stage=String(r.current_stage||'');
  if(stage){ const stageEl=document.createElement('div'); stageEl.className='small'; stageEl.textContent='Current stage: '+stage; el.appendChild(stageEl); }
  const derivedInputs=deriveMissingInputs(r);
  if(derivedInputs.length){
    const resolve=document.createElement('button');
    resolve.className='btn primary';
    resolve.style.marginTop='8px';
    resolve.textContent='Fill required input';
    resolve.onclick=()=>{ lastPendingRunId=r.run_id||''; lastMissingInputs=derivedInputs; openMissingInputModal(derivedInputs, lastPendingRunId); };
    el.appendChild(resolve);
  }
  const events=Array.isArray(r.progress_events)?r.progress_events:[];
  if(events.length){
    const wrap=document.createElement('div');
    wrap.style.marginTop='8px';
    events.slice(-8).forEach(ev=>{
      const line=document.createElement('div');
      const cls=ev.status==='completed'?'done':(ev.status==='waiting'?'wait':'');
      line.className='progressLine';
      line.innerHTML=`<span class="progressDot ${cls}"></span><span>${escapeHtml(ev.label||ev.stage||'step')}</span><span class="small">${escapeHtml(ev.status||'running')}</span>`;
      wrap.appendChild(line);
    });
    el.appendChild(wrap);
  }
  const pre=document.createElement('div');
  pre.className='pre';
  pre.textContent=jsonText;
  el.appendChild(pre);
  return el;
}
function card(title, body){
  const el=document.createElement('div');
  el.className='item';
  const header=document.createElement('div');
  header.className='cardHeader';
  const label=document.createElement('b');
  label.textContent=title;
  const copy=document.createElement('button');
  copy.className='copyBtn';
  copy.textContent='📋 Copy';
  copy.onclick=()=>copyText(body);
  header.appendChild(label);
  header.appendChild(copy);
  const pre=document.createElement('div');
  pre.className='pre';
  pre.textContent=body;
  el.appendChild(header);
  el.appendChild(pre);
  return el;
}
loadModelSelection();
refreshState();
</script>
