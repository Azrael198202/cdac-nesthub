<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Verified AI Core</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f6f7f9; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    textarea { width: 100%; height: 120px; }
    input { width: 100%; padding: 8px; margin: 4px 0; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #111827; color: white; cursor: pointer; }
    pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 12px; border-radius: 8px; max-height: 680px; overflow: auto; }
    .step { padding: 8px; margin: 6px 0; border-left: 4px solid #4f46e5; background: #eef2ff; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>Chat / Agent Task</h2>
    <textarea id="msg">Please check the weather forecast for Tokyo tomorrow and then book a flight to Tokyo.</textarea>
    <br/><br/>
    <button onclick="send()">Run</button>
    <h3>External API Key</h3>
    <input id="provider" value="openai" />
    <input id="key" placeholder="sk-..." type="password" />
    <button onclick="saveKey()">Save Key to runtime/secrets</button>
    <h3>Visible Process</h3>
    <div id="steps"></div>
  </div>
  <div class="card">
    <h2>Result / Trace</h2>
    <pre id="out"></pre>
  </div>
</div>
<script>
const baseSteps = ['Input Parsing', 'Intent Recognition', 'Context Awareness', 'Workflow Planning', 'Execution', 'Feedback Learning', 'Output'];
function renderRunning(){ document.getElementById('steps').innerHTML = baseSteps.map(s=>`<div class="step">⏳ ${s}</div>`).join(''); }
async function send(){
  renderRunning();
  const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: document.getElementById('msg').value})});
  const data = await res.json();
  document.getElementById('out').textContent = JSON.stringify(data, null, 2);
  const events = data.state?.step_results || {};
  document.getElementById('steps').innerHTML = baseSteps.map(s=>`<div class="step">✅ ${s}<br/><small>${s.toLowerCase().replaceAll(' ', '_') in events ? 'completed' : ''}</small></div>`).join('');
}
async function saveKey(){
  const res = await fetch('/api/keys', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({provider:document.getElementById('provider').value, api_key:document.getElementById('key').value})});
  alert(JSON.stringify(await res.json()));
}
</script>
</body>
</html>
