<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AI Core Runtime</title>
<style>
:root {
  --bg: #080d1d;
  --panel: #111827;
  --panel2: #0f172a;
  --line: #25324a;
  --text: #e5edff;
  --muted: #91a1bd;
  --blue: #2563eb;
  --yellow: #3a2a0a;
  --yellowLine: #b45309;
  --red: #991b1b;
  --green: #22c55e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  height: 100vh;
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  height: 100vh;
}
.main {
  position: relative;
  height: 100vh;
  padding: 28px 30px 108px;
  overflow: hidden;
}
.messages {
  height: 100%;
  overflow-y: auto;
  padding-right: 10px;
  scroll-behavior: smooth;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  max-width: 920px;
  white-space: pre-wrap;
  line-height: 1.5;
}
.system { border-style: dashed; }
.info { background: #1d4ed8; border-color: #1d4ed8; }
.approval {
  background: var(--yellow);
  border-color: var(--yellowLine);
  display: grid;
  gap: 12px;
  min-height: auto;
}
.approval-title {
  font-weight: 800;
  font-size: 16px;
}
.approval-message {
  white-space: pre-wrap;
}
.approval-actions {
  display: flex;
  flex-direction: row;
  gap: 10px;
  align-items: center;
}
.console {
  background: #020617;
  border-color: #334155;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: #cbd5e1;
  max-height: 260px;
  overflow-y: auto;
}
.stderr { color: #fca5a5; }
.stdout { color: #bbf7d0; }
.inputbar {
  position: fixed;
  left: 30px;
  right: 410px;
  bottom: 22px;
  z-index: 10;
  display: flex;
  gap: 10px;
  background: #0b1223;
  border: 1px solid #334155;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
}
.inputbar input {
  flex: 1;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
}
button {
  border: 0;
  color: white;
  background: var(--blue);
  padding: 10px 16px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
}
button.reject { background: var(--red); }
button:disabled { opacity: .5; cursor: not-allowed; }
.side {
  border-left: 1px solid var(--line);
  height: 100vh;
  overflow-y: auto;
  padding: 18px 14px;
  background: #070b19;
}
.side h2 {
  margin: 0 0 14px;
  font-size: 18px;
}
.event {
  border: 1px solid var(--line);
  background: var(--panel2);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  font-size: 13px;
}
.event .type {
  color: #93c5fd;
  font-size: 12px;
  margin-bottom: 4px;
}
.event .title {
  font-weight: 800;
  margin-bottom: 4px;
}
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 8px;
  border: 2px solid #64748b;
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.running {
  border-color: #2563eb;
  box-shadow: 0 0 0 1px rgba(37,99,235,.15);
}
.progress-wrap {
  margin-top: 10px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 999px;
  height: 12px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #2563eb, #60a5fa);
  transition: width .25s ease;
}
.progress-label {
  color: #bfdbfe;
  font-size: 12px;
  margin-top: 6px;
}
.command-line {
  word-break: break-all;
  color: #e2e8f0;
}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div id="messages" class="messages">
      <div class="card system">Runtime starts with generic configs only. Provider/model installation requires approval.</div>
      <div class="card system">Console output is streamed here when install/start/model commands run.</div>
    </div>

    <form id="form" class="inputbar">
      <input id="message" placeholder="Message AI Core..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>

  <aside class="side">
    <h2>Execution Workflow</h2>
    <div id="events"></div>
  </aside>
</div>

<script>
let currentRunId = null;
let source = null;
let commandBox = null;
let currentProgressBar = null;
let currentProgressLabel = null;

const messages = document.getElementById("messages");
const events = document.getElementById("events");
const form = document.getElementById("form");
const input = document.getElementById("message");

function esc(text) {
  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function scrollMessages() {
  messages.scrollTop = messages.scrollHeight;
}

function addCard(text, cls="card") {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  messages.appendChild(div);
  scrollMessages();
  return div;
}

function addHtmlCard(html, cls="card") {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = html;
  messages.appendChild(div);
  scrollMessages();
  return div;
}

function updateProgress(percent) {
  if (percent === undefined || percent === null) return;
  const p = Math.max(0, Math.min(100, Number(percent)));
  if (currentProgressBar) currentProgressBar.style.width = p + "%";
  if (currentProgressLabel) currentProgressLabel.textContent = p + "%";
}

function addEvent(ev) {
  const div = document.createElement("div");
  div.className = "event";
  div.innerHTML = `
    <div class="type">${esc(ev.type || "")}</div>
    <div class="title">${esc(ev.title || "")}</div>
    <div>${esc(ev.message || "")}</div>
    ${ev.progress !== undefined ? `<div class="progress-wrap"><div class="progress-bar" style="width:${Number(ev.progress)}%"></div></div><div class="progress-label">${Number(ev.progress)}%</div>` : ""}
  `;
  events.prepend(div);
}

function addCommandBox(command, progress) {
  commandBox = addHtmlCard(`
    <div><span class="spinner"></span><b>[Command started]</b></div>
    <div class="command-line">${esc(command)}</div>
    <div class="progress-wrap"><div id="cmdProgress" class="progress-bar" style="width:${Number(progress || 0)}%"></div></div>
    <div id="cmdProgressLabel" class="progress-label">${Number(progress || 0)}%</div>
    <div id="consoleLines"></div>
  `, "card console running");
  currentProgressBar = commandBox.querySelector("#cmdProgress");
  currentProgressLabel = commandBox.querySelector("#cmdProgressLabel");
}

function appendConsole(line, streamName, progress) {
  if (!commandBox) addCommandBox("running...", progress || 0);
  updateProgress(progress);
  const box = commandBox.querySelector("#consoleLines");
  const row = document.createElement("div");
  row.className = streamName === "stderr" ? "stderr" : "stdout";
  row.textContent = `[${streamName}] ${line}`;
  box.appendChild(row);
  commandBox.scrollTop = commandBox.scrollHeight;
  scrollMessages();
}

function approvalCard(ev) {
  const commands = ev.commands && ev.commands.length
    ? "Commands:\\n" + ev.commands.join("\\n")
    : "";
  const div = document.createElement("div");
  div.className = "card approval";
  div.innerHTML = `
    <div class="approval-title">[Approval required]</div>
    <div class="approval-message">${esc(ev.message || "")}${commands ? "\\n\\n" + esc(commands) : ""}</div>
    ${ev.progress !== undefined ? `<div class="progress-wrap"><div class="progress-bar" style="width:${Number(ev.progress)}%"></div></div><div class="progress-label">${Number(ev.progress)}%</div>` : ""}
    <div class="approval-actions">
      <button class="approve" type="button">Approve</button>
      <button class="reject rejectBtn" type="button">Reject</button>
    </div>
  `;
  div.querySelector(".approve").onclick = async () => {
    div.querySelector(".approve").disabled = true;
    div.querySelector(".rejectBtn").disabled = true;
    addCard("Approved. Resuming workflow...", "card system");
    await fetch("/api/resume", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({run_id: ev.run_id || currentRunId, decision: "approve"})
    });
  };
  div.querySelector(".rejectBtn").onclick = async () => {
    div.querySelector(".approve").disabled = true;
    div.querySelector(".rejectBtn").disabled = true;
    addCard("Rejected. Workflow will stop.", "card system");
    await fetch("/api/resume", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({run_id: ev.run_id || currentRunId, decision: "reject"})
    });
  };
  messages.appendChild(div);
  scrollMessages();
}

function handleEvent(ev) {
  addEvent(ev);

  switch(ev.type) {
    case "RUN_STARTED":
      addCard("[Run started]\\n" + (ev.message || ""));
      break;
    case "NODE_STARTED":
      addCard("[" + (ev.title || "") + "]\\n" + (ev.message || ""));
      break;
    case "MODEL_ROUTE":
    case "PROVIDER_CHECK":
    case "PROVIDER_SKIPPED":
    case "PROVIDER_UNAVAILABLE":
      addCard("[" + (ev.title || "") + "]\\n" + (ev.message || ""));
      break;
    case "HUMAN_REVIEW":
      approvalCard(ev);
      break;
    case "COMMAND_STARTED":
      addCommandBox(ev.command || "", ev.progress || 0);
      break;
    case "COMMAND_OUTPUT":
      appendConsole(ev.line || "", ev.stream || "stdout", ev.progress);
      break;
    case "COMMAND_FINISHED":
      updateProgress(ev.progress || 100);
      if (commandBox) commandBox.classList.remove("running");
      addCard("[Command finished]\\n" + (ev.message || ""));
      break;
    case "PROVIDER_FIX_DONE":
      addCard("[Provider fix completed]\\n" + (ev.message || ""));
      break;
    case "PROVIDER_FIX_FAILED":
      addCard("[Provider fix failed]\\n" + (ev.message || ""));
      break;
    case "RESUMED":
      addCard("[Run resumed]\\n" + (ev.message || ""));
      break;
    case "NODE_RESULT":
      addCard("[" + (ev.title || "") + "]\\n" + JSON.stringify(ev.result || {}, null, 2));
      break;
    case "RUN_COMPLETED":
      addCard("[Final output]\\n" + (ev.message || ""));
      if (source) source.close();
      break;
    case "RUN_FAILED":
    case "RUN_CANCELLED":
      addCard("[" + (ev.title || "Run stopped") + "]\\n" + (ev.message || ""));
      if (source) source.close();
      break;
  }
}

function connect(runId) {
  if (source) source.close();
  source = new EventSource("/api/events/" + runId);
  source.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    handleEvent(ev);
  };
  source.onerror = () => {
    addCard("Stream connection closed or failed.", "card system");
    if (source) source.close();
  };
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addCard(text, "card info");
  input.value = "";

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text})
  });
  const data = await res.json();
  currentRunId = data.run_id;
  connect(currentRunId);
};
</script>
</body>
</html>
