<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AI Core Config-Driven Node Runtime v13</title>
<style>
:root{--bg:#080d1d;--panel:#111827;--panel2:#0f172a;--line:#25324a;--text:#e5edff;--blue:#2563eb;--yellow:#3a2a0a;--yellowLine:#b45309;--red:#991b1b;--green:#166534}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;height:100vh;overflow:hidden;font-size:12px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100vh}
.main{position:relative;height:100vh;padding:18px 22px 92px;overflow:hidden}
.messages{height:100%;overflow-y:auto;padding-right:10px;scroll-behavior:smooth}
.bubble{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;max-width:78%;white-space:pre-wrap;line-height:1.35}
.system{background:var(--panel);margin-right:auto}
.user{background:#1d4ed8;border-color:#1d4ed8;margin-left:auto}
.approval{background:var(--yellow);border-color:var(--yellowLine);max-width:86%;margin-right:auto}
.result{background:#07111f}
.error{background:#3b0b0b;border-color:#991b1b}
.spec,.json-editor{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#020617;border:1px solid #334155;border-radius:8px;padding:8px;max-height:260px;overflow:auto;font-size:11px}
.json-editor{width:100%;height:220px;color:#d1fae5;resize:vertical}
.inputbar{position:fixed;left:22px;right:430px;bottom:18px;display:flex;gap:10px;background:#0b1223;border:1px solid #334155;border-radius:14px;padding:10px}
.inputbar input{flex:1;border:0;outline:none;background:transparent;color:var(--text);font-size:12px;font-family:inherit}
button{border:0;color:white;background:var(--blue);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px}
button.reject{background:var(--red)}
button.modify{background:var(--green)}
button:disabled{opacity:.45}
.side{border-left:1px solid var(--line);height:100vh;overflow-y:auto;padding:14px;background:#070b19}
.side h2{font-size:15px;margin:0 0 12px}
.event{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:8px}
.type{color:#93c5fd;font-size:11px}.title{font-weight:800;margin:3px 0}
.progress-wrap{margin-top:8px;background:#111827;border:1px solid #334155;border-radius:999px;height:8px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid #64748b;border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}.runningLine{color:#bfdbfe}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div id="messages" class="messages">
      <div class="bubble system">Build version: v13 / JS syntax fixed / API returns run_id immediately.</div>
      <div class="bubble system">Config-Driven Node Runtime: ai_core only loads runtime-generated node config and dispatches generic executors.</div>
    </div>
    <form id="form" class="inputbar">
      <input id="message" placeholder="Message AI Core..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>
  <aside class="side">
    <h2>Execution Workflow</h2>
    <div id="events"></div>
  </aside>
</div>

<script>
let currentRunId = null;
let source = null;

const messages = document.getElementById("messages");
const events = document.getElementById("events");
const form = document.getElementById("form");
const input = document.getElementById("message");

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function scrollMessages() {
  messages.scrollTop = messages.scrollHeight;
}

function bubble(text, cls = "system") {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;
  messages.appendChild(div);
  scrollMessages();
  return div;
}

function htmlBubble(html, cls = "system") {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.innerHTML = html;
  messages.appendChild(div);
  scrollMessages();
  return div;
}

function addEvent(ev) {
  const div = document.createElement("div");
  div.className = "event";
  const progress = ev.progress !== undefined
    ? `<div class="progress-wrap"><div class="progress-bar" style="width:${Number(ev.progress)}%"></div></div>`
    : "";
  div.innerHTML = `
    <div class="type">${esc(ev.type || "")}</div>
    <div class="title">${esc(ev.title || "")}</div>
    <div>${esc(ev.message || "")}</div>
    ${progress}
  `;
  events.prepend(div);
}

function review(ev) {
  const result = ev.result || ev.spec || {};
  const json = JSON.stringify(result, null, 2);
  const div = document.createElement("div");
  div.className = "bubble approval";
  div.innerHTML = `
    <b>[Human Review]</b>
    <div>${esc(ev.message || "")}</div>
    <div class="spec">${esc(json)}</div>
    <textarea class="json-editor" style="display:none">${esc(json)}</textarea>
    <textarea class="feedback" placeholder="Reject reason or modification note..." style="width:100%;height:70px;background:#020617;color:#e5edff;border:1px solid #334155;border-radius:8px;margin-top:8px;padding:8px;font-family:inherit;font-size:11px"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="approve" type="button">Approve</button>
      <button class="reject" type="button">Reject & Retry</button>
      <button class="modify" type="button">Modify JSON & Continue</button>
      <button class="edit" type="button">Edit JSON</button>
    </div>
  `;
  messages.appendChild(div);
  scrollMessages();

  const editor = div.querySelector(".json-editor");
  const spec = div.querySelector(".spec");
  const feedback = div.querySelector(".feedback");

  div.querySelector(".edit").onclick = () => {
    const editing = editor.style.display === "none";
    editor.style.display = editing ? "block" : "none";
    spec.style.display = editing ? "none" : "block";
  };

  async function resume(decision, modifiedResult, feedbackText) {
    for (const btn of div.querySelectorAll("button")) btn.disabled = true;
    bubble(`${decision.toUpperCase()}: resuming workflow...`, "system");
    const res = await fetch("/api/resume", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        run_id: ev.run_id || currentRunId,
        decision: decision,
        modified_result: modifiedResult,
        feedback: feedbackText
      })
    });
    if (!res.ok) {
      bubble(`Resume failed: HTTP ${res.status}`, "error");
    }
  }

  div.querySelector(".approve").onclick = () => resume("approve", null, feedback.value);
  div.querySelector(".reject").onclick = () => resume("reject", null, feedback.value || "Rejected by human.");
  div.querySelector(".modify").onclick = () => {
    try {
      resume("modify", JSON.parse(editor.value), feedback.value);
    } catch (err) {
      alert("Invalid JSON: " + err.message);
    }
  };
}


const runningTimers = {};

function runningBubble(key, title, message) {
  const id = "run-" + key.replaceAll("_", "-");
  let div = document.getElementById(id);
  if (!div) {
    div = document.createElement("div");
    div.id = id;
    div.className = "bubble system";
    div.dataset.startedAt = String(Date.now());
    messages.appendChild(div);
  }
  const elapsed = Math.floor((Date.now() - Number(div.dataset.startedAt)) / 1000);
  div.innerHTML = `<span class="spinner"></span><b>${esc(title)}</b>\n<span class="runningLine">${esc(message)}</span>\nElapsed: ${elapsed}s`;
  scrollMessages();

  if (!runningTimers[key]) {
    runningTimers[key] = setInterval(() => {
      const current = document.getElementById(id);
      if (!current) {
        clearInterval(runningTimers[key]);
        delete runningTimers[key];
        return;
      }
      const sec = Math.floor((Date.now() - Number(current.dataset.startedAt)) / 1000);
      const line = current.querySelector(".runningLine")?.textContent || message;
      current.innerHTML = `<span class="spinner"></span><b>${esc(title)}</b>\n<span class="runningLine">${esc(line)}</span>\nElapsed: ${sec}s`;
    }, 1000);
  }
}

function finishRunning(key, title, message, cls = "system") {
  const timer = runningTimers[key];
  if (timer) {
    clearInterval(timer);
    delete runningTimers[key];
  }
  const id = "run-" + key.replaceAll("_", "-");
  const div = document.getElementById(id);
  if (div) {
    div.className = "bubble " + cls;
    div.textContent = `[${title}]\n${message}`;
  } else {
    bubble(`[${title}]\n${message}`, cls);
  }
}


function secretRequired(ev) {
  const div = document.createElement("div");
  div.className = "bubble approval";
  div.innerHTML = `
    <b>[API Key Required]</b>
    <div>${esc(ev.message || "")}</div>
    <input class="secret-value" type="password" placeholder="${esc(ev.secret_key || "API_KEY")}" style="width:100%;background:#020617;color:#e5edff;border:1px solid #334155;border-radius:8px;margin-top:8px;padding:8px;font-family:inherit;font-size:11px" />
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="approve" type="button">Save Key & Continue</button>
      <button class="reject" type="button">Cancel</button>
    </div>
  `;
  messages.appendChild(div);
  scrollMessages();

  const input = div.querySelector(".secret-value");

  div.querySelector(".approve").onclick = async () => {
    const value = input.value.trim();
    if (!value) {
      alert("Please input the API key.");
      return;
    }
    for (const btn of div.querySelectorAll("button")) btn.disabled = true;
    bubble("[Secret]\\nSaving key and resuming workflow...", "system");
    await fetch("/api/resume", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        run_id: ev.run_id || currentRunId,
        decision: "approve",
        modified_result: {value: value},
        feedback: "secret provided"
      })
    });
  };

  div.querySelector(".reject").onclick = async () => {
    for (const btn of div.querySelectorAll("button")) btn.disabled = true;
    await fetch("/api/resume", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        run_id: ev.run_id || currentRunId,
        decision: "reject",
        feedback: "secret cancelled"
      })
    });
  };
}


function handleEvent(ev) {
  addEvent(ev);

  if (ev.type === "LLM_PROVIDER_START" || ev.type === "LLM_REQUEST_SENT") {
    const key = `${ev.node_id || "node"}_${ev.provider || "provider"}`;
    runningBubble(key, ev.title || ev.type, ev.message || "Running...");
    return;
  }

  if (ev.type === "LLM_PROVIDER_DONE") {
    const key = `${ev.node_id || "node"}_${ev.provider || "provider"}`;
    finishRunning(key, ev.title || ev.type, ev.message || "Completed.", "system");
    return;
  }

  if (ev.type === "LLM_PROVIDER_ERROR") {
    const key = `${ev.node_id || "node"}_${ev.provider || "provider"}`;
    finishRunning(key, ev.title || ev.type, ev.message || "Failed.", "error");
    return;
  }


  if (ev.type === "SECRET_REQUIRED") {
    secretRequired(ev);
    return;
  }

  if (ev.type === "PROVIDER_COMMAND_STARTED") {
    runningBubble("provider_command", ev.title || ev.type, ev.message || "Running provider command...");
    return;
  }

  if (ev.type === "PROVIDER_COMMAND_OUTPUT") {
    bubble(`[${ev.stream || "output"}]\n${ev.message || ""}`, "system");
    return;
  }

  if (ev.type === "PROVIDER_COMMAND_FINISHED") {
    finishRunning("provider_command", ev.title || ev.type, ev.message || "Provider command completed.", "system");
    return;
  }

  if (ev.type === "LLM_MODEL_MISSING" || ev.type === "LLM_MODEL_READY" || ev.type === "SECRET_SAVED" || ev.type === "CORRECTION_RECORDED" || ev.type === "CORRECTION_MEMORY_APPLIED" || ev.type === "PROVIDER_COMMAND_RESOLVED" || ev.type === "LLM_MODEL_FALLBACK" || ev.type === "LLM_MODEL_PULL_FAILED" || ev.type === "LLM_ENDPOINT_FALLBACK") {
    bubble(`[${ev.title || ev.type}]\n${ev.message || ""}`, "system");
    return;
  }

  if (ev.type === "NODE_RESULT") {
    htmlBubble(`<b>[${esc(ev.title)}]</b><div class="spec">${esc(JSON.stringify(ev.result || {}, null, 2))}</div>`, "result");
    return;
  }

  if (ev.type === "HUMAN_REVIEW") {
    review(ev);
    return;
  }

  if (ev.type === "RUN_COMPLETED") {
    htmlBubble(`<b>[Final Output]</b><div>${esc(ev.message || "")}</div><div class="spec">${esc(JSON.stringify(ev.results || {}, null, 2))}</div>`, "system");
    if (source) source.close();
    return;
  }

  if (ev.type === "RUN_FAILED" || ev.type === "RUN_CANCELLED") {
    bubble(`[${ev.title || ev.type}]\n${ev.message || ""}`, "error");
    if (source) source.close();
    return;
  }

  bubble(`[${ev.title || ev.type}]\n${ev.message || ""}`, "system");
}

function connect(runId) {
  if (source) source.close();
  source = new EventSource(`/api/events/${runId}`);
  source.onopen = () => bubble(`[SSE connected]\nrun_id=${runId}`, "system");
  source.onmessage = (msg) => {
    try {
      handleEvent(JSON.parse(msg.data));
    } catch (err) {
      bubble("Failed to parse SSE event: " + err.message, "error");
    }
  };
  source.onerror = () => {
    bubble("SSE stream closed or failed. Check server logs and DevTools Network tab.", "error");
    if (source) source.close();
  };
}

form.onsubmit = async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  bubble(text, "user");
  input.value = "";

  try {
    bubble("[Sending]\nPOST /api/chat", "system");
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text})
    });

    if (!res.ok) {
      const body = await res.text();
      bubble(`POST /api/chat failed: HTTP ${res.status}\n${body}`, "error");
      return;
    }

    const data = await res.json();
    currentRunId = data.run_id;
    bubble(`[Run queued]\nrun_id=${currentRunId}`, "system");
    connect(currentRunId);
  } catch (err) {
    bubble("POST /api/chat error: " + err.message, "error");
  }
};
</script>
</body>
</html>
