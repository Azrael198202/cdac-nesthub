<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pure Runtime AI Core</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>AI Core</h1>
      <p>Pure runtime orchestration</p>
      <button id="settingsBtn">Settings</button>
      <div class="status" id="status">Checking runtime...</div>
      <div class="note">
        <strong>Core rule</strong><br />
        ai_core contains no business logic. Runtime configs are generated while running.
      </div>
    </aside>

    <main class="main">
      <section class="chat">
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <textarea id="messageInput" placeholder="Type a task or question. The workflow trace will appear on the right." rows="3"></textarea>
          <button type="submit">Run</button>
        </form>
      </section>

      <section class="tracePanel">
        <div class="traceHeader">
          <span>Execution Workflow</span>
          <button id="clearTrace">Clear</button>
        </div>
        <div id="trace" class="trace"></div>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings">
      <h2>Runtime Model Settings</h2>
      <label>Provider
        <select id="provider">
          <option value="auto">Auto</option>
          <option value="ollama">Ollama</option>
          <option value="openai">OpenAI API</option>
        </select>
      </label>
      <label>OpenAI API Key
        <input id="openaiKey" type="password" placeholder="sk-..." />
      </label>
      <label>OpenAI Model
        <input id="openaiModel" value="gpt-4o-mini" />
      </label>
      <label>Ollama Base URL
        <input id="ollamaBase" value="http://127.0.0.1:11434" />
      </label>
      <label>Ollama Model
        <input id="ollamaModel" value="qwen3:4b" />
      </label>
      <menu>
        <button value="cancel">Cancel</button>
        <button id="saveSettings" value="default">Save</button>
      </menu>
    </form>
  </dialog>

  <script src="/static/script.js"></script>
</body>
</html>
