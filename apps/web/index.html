<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>AI Core Dynamic Capability Runtime v2</title>
<style>
:root{--bg:#080d1d;--panel:#111827;--panel2:#0f172a;--line:#25324a;--text:#e5edff;--blue:#2563eb;--yellow:#3a2a0a;--yellowLine:#b45309;--red:#991b1b;--green:#166534}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;height:100vh;overflow:hidden;font-size:12px}.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100vh}.main{position:relative;height:100vh;padding:18px 22px 92px;overflow:hidden}.messages{height:100%;overflow-y:auto;padding-right:10px;scroll-behavior:smooth}.bubble{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;max-width:78%;white-space:pre-wrap;line-height:1.35}.system{background:var(--panel);margin-right:auto}.user{background:#1d4ed8;border-color:#1d4ed8;margin-left:auto}.approval{background:var(--yellow);border-color:var(--yellowLine);max-width:86%;margin-right:auto}.result{background:#07111f}.spec,.json-editor{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#020617;border:1px solid #334155;border-radius:8px;padding:8px;max-height:260px;overflow:auto;font-size:11px}.json-editor{width:100%;height:220px;color:#d1fae5;resize:vertical}.inputbar{position:fixed;left:22px;right:430px;bottom:18px;display:flex;gap:10px;background:#0b1223;border:1px solid #334155;border-radius:14px;padding:10px}.inputbar input{flex:1;border:0;outline:none;background:transparent;color:var(--text);font-size:12px;font-family:inherit}button{border:0;color:white;background:var(--blue);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px}button.reject{background:var(--red)}button.modify{background:var(--green)}button:disabled{opacity:.45}.side{border-left:1px solid var(--line);height:100vh;overflow-y:auto;padding:14px;background:#070b19}.side h2{font-size:15px;margin:0 0 12px}.event{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;margin-bottom:8px}.type{color:#93c5fd;font-size:11px}.title{font-weight:800;margin:3px 0}.progress-wrap{margin-top:8px;background:#111827;border:1px solid #334155;border-radius:999px;height:8px;overflow:hidden}.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}.progress-label{color:#bfdbfe;font-size:11px;margin-top:4px}
</style>
</head>
<body>
<div class="app">
<main class="main">
<div id="messages" class="messages">
<div class="bubble system">Dynamic Capability Runtime v2: capability readiness is separated from real node execution.</div>
</div>
<form id="form" class="inputbar">
<input id="message" placeholder="Message AI Core..." autocomplete="off"/>
<button type="submit">Send</button>
</form>
</main>
<aside class="side"><h2>Execution Workflow</h2><div id="events"></div></aside>
</div>
<script>
let currentRunId=null,source=null;const messages=document.getElementById("messages"),events=document.getElementById("events"),form=document.getElementById("form"),input=document.getElementById("message");
function esc(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}function scroll(){messages.scrollTop=messages.scrollHeight}
function bubble(text,cls="system"){const d=document.createElement("div");d.className="bubble "+cls;d.textContent=text;messages.appendChild(d);scroll();return d}
function htmlBubble(html,cls="system"){const d=document.createElement("div");d.className="bubble "+cls;d.innerHTML=html;messages.appendChild(d);scroll();return d}
function addEvent(ev){const d=document.createElement("div");d.className="event";d.innerHTML=`<div class="type">${esc(ev.type||"")}</div><div class="title">${esc(ev.title||"")}</div><div>${esc(ev.message||"")}</div>${ev.progress!==undefined?`<div class="progress-wrap"><div class="progress-bar" style="width:${Number(ev.progress)}%"></div></div><div class="progress-label">${Number(ev.progress)}%</div>`:""}`;events.prepend(d)}
function review(ev){const result=ev.result||ev.spec||{};const json=JSON.stringify(result,null,2);const d=document.createElement("div");d.className="bubble approval";d.innerHTML=`<b>[Human Review]</b>\n${esc(ev.message||"")}\n\n<div class="spec">${esc(json)}</div>\n<textarea class="json-editor" style="display:none">${esc(json)}</textarea>\n<textarea class="feedback" placeholder="Reject reason or modification note..." style="width:100%;height:70px;background:#020617;color:#e5edff;border:1px solid #334155;border-radius:8px;margin-top:8px;padding:8px;font-family:inherit;font-size:11px"></textarea>\n<div style="display:flex;gap:8px;margin-top:8px"><button class="approve">Approve</button><button class="reject">Reject & Retry</button><button class="modify">Modify JSON & Continue</button><button class="edit">Edit JSON</button></div>`;messages.appendChild(d);scroll();
const editor=d.querySelector(".json-editor"),spec=d.querySelector(".spec"),feedback=d.querySelector(".feedback");
d.querySelector(".edit").onclick=()=>{editor.style.display=editor.style.display==="none"?"block":"none";spec.style.display=spec.style.display==="none"?"block":"none"};
d.querySelector(".approve").onclick=()=>resume("approve",null,feedback.value);
d.querySelector(".reject").onclick=()=>resume("reject",null,feedback.value||"Rejected by human.");
d.querySelector(".modify").onclick=()=>{try{resume("modify",JSON.parse(editor.value),feedback.value)}catch(e){alert("Invalid JSON: "+e.message)}};
async function resume(decision,modified,fb){for(const b of d.querySelectorAll("button"))b.disabled=true;bubble(decision.toUpperCase()+": resuming workflow...","system");await fetch("/api/resume",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({run_id:ev.run_id||currentRunId,decision:decision,modified_result:modified,feedback:fb})})}}
function handle(ev){addEvent(ev);switch(ev.type){case"RUN_STARTED":case"NODE_STARTED":case"CAPABILITY_ROUTE":case"CAPABILITY_READY":case"NODE_EXECUTING":case"APPROVED_CONTINUE":case"REJECTED_RETRY":case"MODIFIED_CONTINUE":bubble("["+ev.title+"]\n"+(ev.message||""),"system");break;case"NODE_RESULT":htmlBubble(`<b>[${esc(ev.title)}]</b>\n<div class="spec">${esc(JSON.stringify(ev.result||{},null,2))}</div>`,"result");break;case"HUMAN_REVIEW":review(ev);break;case"RUN_COMPLETED":htmlBubble(`<b>[Final Output]</b>\n${esc(ev.message||"")}\n<div class="spec">${esc(JSON.stringify(ev.results||{},null,2))}</div>`,"system");if(source)source.close();break;case"RUN_FAILED":case"RUN_CANCELLED":bubble("["+ev.title+"]\n"+(ev.message||""),"system");if(source)source.close();break;default:bubble("["+ (ev.title||ev.type) +"]\n"+(ev.message||""),"system")}}
function connect(id){if(source)source.close();source=new EventSource("/api/events/"+id);source.onmessage=m=>handle(JSON.parse(m.data));source.onerror=()=>{bubble("Stream closed.","system");if(source)source.close()}}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;bubble(text,"user");input.value="";const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});const data=await res.json();currentRunId=data.run_id;connect(currentRunId)}
</script>
</body>
</html>
