<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runtime Visible AI Core</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; }
    .layout { display:grid; grid-template-columns: 1fr 420px; height:100vh; }
    .chat { padding:24px; overflow:auto; }
    .trace { border-left:1px solid #334155; background:#111827; padding:16px; overflow:auto; }
    .msg { max-width:900px; padding:14px 16px; border-radius:14px; margin:10px 0; white-space:pre-wrap; }
    .user { background:#1d4ed8; margin-left:auto; }
    .assistant { background:#1f2937; }
    .event { border:1px solid #334155; border-radius:12px; padding:10px; margin:8px 0; background:#020617; }
    .event b { color:#93c5fd; }
    .event pre { white-space:pre-wrap; font-size:12px; color:#cbd5e1; }
    .bar { position:fixed; bottom:0; left:0; right:420px; display:flex; gap:8px; padding:16px; background:#020617; border-top:1px solid #334155; }
    input { flex:1; padding:14px; border-radius:12px; border:1px solid #475569; background:#0f172a; color:white; }
    button { padding:0 18px; border:0; border-radius:12px; background:#22c55e; color:#052e16; font-weight:bold; cursor:pointer; }
    h2 { margin-top:0; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#334155; font-size:12px; color:#dbeafe; }
  </style>
</head>
<body>
<div class="layout">
  <main class="chat" id="chat">
    <h2>AI Core Chat</h2>
    <div class="msg assistant">输入示例：Please check the weather forecast for Tokyo tomorrow and then book a flight to Tokyo.</div>
  </main>
  <aside class="trace">
    <h2>Execution Trace <span class="pill">ChatGPT / Codex-like</span></h2>
    <div id="trace"></div>
  </aside>
</div>
<div class="bar">
  <input id="input" value="Please check the weather forecast for Tokyo tomorrow and then book a flight to Tokyo." />
  <button onclick="send()">Run</button>
</div>
<script>
function addChat(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; document.getElementById('chat').appendChild(d); d.scrollIntoView(); }
function addEvent(e){ const d=document.createElement('div'); d.className='event'; d.innerHTML=`<b>${e.type}</b> — ${e.title}<pre>${e.message||''}</pre>`; document.getElementById('trace').appendChild(d); d.scrollIntoView(); }
async function send(){
  const input=document.getElementById('input'); const text=input.value; addChat('user', text);
  const res=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
  const reader=res.body.getReader(); const decoder=new TextDecoder(); let buf='';
  while(true){ const {value,done}=await reader.read(); if(done) break; buf+=decoder.decode(value,{stream:true});
    const parts=buf.split('\n\n'); buf=parts.pop();
    for(const part of parts){ if(!part.startsWith('data: ')) continue; const e=JSON.parse(part.slice(6)); addEvent(e); if(e.type==='final') addChat('assistant', e.message); }
  }
}
</script>
</body>
</html>
