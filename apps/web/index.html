<!doctype html><html><head><meta charset="utf-8"><title>AI Core Config-Driven Node Runtime v3</title><style>body{margin:0;background:#080d1d;color:#e5edff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:1fr 410px;height:100vh}.main{padding:18px 22px 92px;overflow:hidden}.messages{height:100%;overflow:auto}.bubble{border:1px solid #25324a;border-radius:12px;padding:12px;margin:10px 0;max-width:78%;white-space:pre-wrap}.system{background:#111827;margin-right:auto}.user{background:#1d4ed8;margin-left:auto}.approval{background:#3a2a0a;border-color:#b45309}.result{background:#07111f}.spec,.json-editor{font-family:inherit;background:#020617;border:1px solid #334155;border-radius:8px;padding:8px;max-height:260px;overflow:auto;font-size:11px}.json-editor{width:100%;height:220px;color:#d1fae5}.inputbar{position:fixed;left:22px;right:430px;bottom:18px;display:flex;gap:10px;background:#0b1223;border:1px solid #334155;border-radius:14px;padding:10px}.inputbar input{flex:1;background:transparent;color:#e5edff;border:0;outline:none;font-family:inherit}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:8px 12px}.reject{background:#991b1b}.modify{background:#166534}.side{border-left:1px solid #25324a;overflow:auto;padding:14px;background:#070b19}.event{border:1px solid #25324a;background:#0f172a;border-radius:10px;padding:10px;margin-bottom:8px}.type{color:#93c5fd}.title{font-weight:800}.progress-wrap{margin-top:8px;background:#111827;border:1px solid #334155;border-radius:999px;height:8px}.progress-bar{height:100%;background:#60a5fa}</style></head><body><div class="app"><main class="main"><div id="messages" class="messages"><div class="bubble system">Config-Driven Node Runtime v3: ai_core only loads node config and dispatches generic executors.</div></div><form id="form" class="inputbar"><input id="message" placeholder="Message AI Core..."/><button>Send</button></form></main><aside class="side"><h2>Execution Workflow</h2><div id="events"></div></aside></div><script>let currentRunId=null,source=null;const messages=document.getElementById("messages"),events=document.getElementById("events"),form=document.getElementById("form"),input=document.getElementById("message");function esc(t){return String(t??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}function scroll(){messages.scrollTop=messages.scrollHeight}function bubble(t,c="system"){const d=document.createElement("div");d.className="bubble "+c;d.textContent=t;messages.appendChild(d);scroll();return d}function htmlBubble(h,c="system"){const d=document.createElement("div");d.className="bubble "+c;d.innerHTML=h;messages.appendChild(d);scroll();return d}function addEvent(ev){const d=document.createElement("div");d.className="event";d.innerHTML=`<div class="type">${esc(ev.type||"")}</div><div class="title">${esc(ev.title||"")}</div><div>${esc(ev.message||"")}</div>${ev.progress!==undefined?`<div class="progress-wrap"><div class="progress-bar" style="width:${Number(ev.progress)}%"></div></div>`:""}`;events.prepend(d)}function review(ev){const result=ev.result||ev.spec||{};const json=JSON.stringify(result,null,2);const d=document.createElement("div");d.className="bubble approval";d.innerHTML=`<b>[Human Review]</b>
${esc(ev.message||"")}

<div class="spec">${esc(json)}</div><textarea class="json-editor" style="display:none">${esc(json)}</textarea><textarea class="feedback" placeholder="Reject reason or modification note..." style="width:100%;height:70px;background:#020617;color:#e5edff;border:1px solid #334155;border-radius:8px;margin-top:8px;padding:8px;font-family:inherit;font-size:11px"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="approve">Approve</button><button class="reject">Reject & Retry</button><button class="modify">Modify JSON & Continue</button><button class="edit">Edit JSON</button></div>`;messages.appendChild(d);scroll();const editor=d.querySelector(".json-editor"),spec=d.querySelector(".spec"),feedback=d.querySelector(".feedback");d.querySelector(".edit").onclick=()=>{editor.style.display=editor.style.display==="none"?"block":"none";spec.style.display=spec.style.display==="none"?"block":"none"};d.querySelector(".approve").onclick=()=>resume("approve",null,feedback.value);d.querySelector(".reject").onclick=()=>resume("reject",null,feedback.value||"Rejected by human.");d.querySelector(".modify").onclick=()=>{try{resume("modify",JSON.parse(editor.value),feedback.value)}catch(e){alert("Invalid JSON: "+e.message)}};async function resume(decision,modified,fb){for(const b of d.querySelectorAll("button"))b.disabled=true;bubble(decision.toUpperCase()+": resuming workflow...");await fetch("/api/resume",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({run_id:ev.run_id||currentRunId,decision,modified_result:modified,feedback:fb})})}}function handle(ev){addEvent(ev);if(ev.type==="NODE_RESULT")htmlBubble(`<b>[${esc(ev.title)}]</b><div class="spec">${esc(JSON.stringify(ev.result||{},null,2))}</div>`,"result");else if(ev.type==="HUMAN_REVIEW")review(ev);else if(ev.type==="RUN_COMPLETED"){htmlBubble(`<b>[Final Output]</b>
${esc(ev.message||"")}<div class="spec">${esc(JSON.stringify(ev.results||{},null,2))}</div>`);if(source)source.close()}else bubble("["+(ev.title||ev.type)+"]
"+(ev.message||""))}function connect(id){if(source)source.close();source=new EventSource("/api/events/"+id);source.onmessage=m=>handle(JSON.parse(m.data));source.onerror=()=>{bubble("Stream closed.");if(source)source.close()}}form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;bubble(text,"user");input.value="";const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});const data=await res.json();currentRunId=data.run_id;connect(currentRunId)}</script></body></html>
