<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Runtime Explorer</title><style>
body{margin:0;background:#0b0f14;color:#d7dee7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}header{padding:12px 16px;border-bottom:1px solid #202936;display:flex;gap:10px;align-items:center}a,button{background:#111827;color:#e6edf3;border:1px solid #303b4b;border-radius:6px;padding:7px 10px;text-decoration:none;font-family:inherit}main{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 54px)}#tree{border-right:1px solid #202936;overflow:auto;padding:12px}.item{padding:7px 8px;border-radius:6px;cursor:pointer}.item:hover{background:#132033}.dir{color:#7ee787}.file{color:#9ecbff}.meta{color:#7f8c9a;font-size:11px}#viewer{padding:14px;overflow:auto;white-space:pre-wrap}.toolbar{display:flex;gap:8px;margin-bottom:12px}</style></head><body>
<header><b>Runtime Explorer</b><a href="/agent-studio">New Session</a><a href="/graph-runtime">Graph Runtime</a><a href="/runtime-console">Runtime Console</a><a href="/settings">Settings</a><button onclick="loadTree()">Refresh</button></header>
<main><div id="tree"></div><div id="viewer"><div class="toolbar"><button onclick="downloadSelected()">Download</button><button onclick="deleteSelected()">Delete</button></div><pre id="content">Select a runtime file.</pre></div></main>
<script>
let selected=null;function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function loadTree(){const r=await fetch('/api/runtime-explorer/tree',{cache:'no-store'});const data=await r.json();const box=document.getElementById('tree');box.innerHTML='';(data.entries||[]).forEach(e=>{const d=document.createElement('div');d.className='item '+(e.type==='directory'?'dir':'file');d.innerHTML=(e.type==='directory'?'▸ ':'  ')+esc(e.path)+`<div class="meta">${e.type} · ${e.size_bytes||0} bytes</div>`;d.onclick=()=>selectItem(e);box.appendChild(d)});}
async function selectItem(e){selected=e;if(e.type!=='file'){document.getElementById('content').textContent=e.path;return;}const r=await fetch('/api/runtime-console/read?source='+encodeURIComponent(e.path)+'&tail=true&limit_bytes=120000',{cache:'no-store'});const data=await r.json();document.getElementById('content').textContent=data.content||'';}
function downloadSelected(){if(selected&&selected.type==='file') location.href='/api/runtime-explorer/download?path='+encodeURIComponent(selected.path)}
async function deleteSelected(){if(!selected||selected.type!=='file')return; if(!confirm('Delete '+selected.path+' ?'))return; await fetch('/api/runtime-explorer/delete?path='+encodeURIComponent(selected.path),{method:'DELETE'});selected=null;document.getElementById('content').textContent='Deleted.';loadTree();}
loadTree();</script></body></html>
